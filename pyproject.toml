[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-anon"
version = "1.7.0rc1"
description = "OSS-first PII anonymization/pseudonymization core with integrated evaluation workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "PII Platform Contributors", email = "pii-anon@proton.me" },
]
keywords = [
  "pii",
  "privacy",
  "anonymization",
  "pseudonymization",
  "llm",
  "data-security",
  "data-pipeline",
  "compliance",
  "evaluation",
  "benchmark",
  "multilingual",
  "ner",
  "gdpr",
  "nist",
]
classifiers = [
  # RC classifier (release-gate CQ finding): revert to "5 - Production/Stable"
  # when the next final, non-rc release is tagged.
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
# Core dependency: pydantic v2.  Upper-bounded to v3 so a future breaking
# release does not silently break installs; widen the bound explicitly
# when pydantic 3 lands and we have validated compatibility.
dependencies = ["pydantic>=2.8,<3"]

[project.urls]
Homepage = "https://github.com/subhash-holla/pii-anon"
Documentation = "https://github.com/subhash-holla/pii-anon-doc"
Repository = "https://github.com/subhash-holla/pii-anon"
Issues = "https://github.com/subhash-holla/pii-anon/issues"

[project.scripts]
pii-anon = "pii_anon.cli:main"

[project.entry-points."pii_anon.engines"]
regex = "pii_anon.engines.regex_adapter:RegexEngineAdapter"
presidio = "pii_anon.engines.presidio_adapter:PresidioAdapter"
llm_guard = "pii_anon.engines.llm_guard_adapter:LLMGuardAdapter"
scrubadub = "pii_anon.engines.scrubadub_adapter:ScrubadubAdapter"
spacy_ner = "pii_anon.engines.spacy_adapter:SpacyNERAdapter"
stanza_ner = "pii_anon.engines.stanza_adapter:StanzaNERAdapter"
gliner = "pii_anon.engines.gliner_adapter:GLiNERAdapter"

[project.entry-points."pii_anon.rating_engines"]
glicko-legacy = "pii_anon.eval_framework.rating.elo:PIIRateEloEngine"
bradley-terry-mle = "pii_anon.eval_framework.rating.bradley_terry:BradleyTerryMLEEngine"
bayes-bt = "pii_anon.eval_framework.rating.bayes_bt:BayesBTEngine"

# S6-04 (FR-001/FR-002): BYO-pipeline predictors. Third-party packages
# advertise their own Predictor under this group; the five in-tree
# incumbents ship here so they ride the identical scoring path.
[project.entry-points."pii_anon.byo_pipelines"]
gliner = "pii_anon.eval_framework.byo_pipeline:gliner_predictor"
presidio = "pii_anon.eval_framework.byo_pipeline:presidio_predictor"
scrubadub = "pii_anon.eval_framework.byo_pipeline:scrubadub_predictor"
spacy_ner = "pii_anon.eval_framework.byo_pipeline:spacy_ner_predictor"
stanza_ner = "pii_anon.eval_framework.byo_pipeline:stanza_ner_predictor"

# S7-01 (FR-031): native-format readers. Third-party packages advertise
# their own NativeReader here; the five in-tree readers ship on the group.
[project.entry-points."pii_anon.readers"]
pdf = "pii_anon.ingestion.native_pdf:PdfTextReader"
image = "pii_anon.ingestion.native:ImageOcrReader"
screenshot = "pii_anon.ingestion.native:ScreenshotOcrReader"
dicom = "pii_anon.ingestion.native:DicomReader"
audio = "pii_anon.ingestion.native:AudioReader"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.0",
  "ruff>=0.8",
  "mypy>=1.10",
  "build>=1.2",
  "twine>=5.0",
  "tqdm>=4.66",
  "jupyter>=1.0",
  "nbconvert>=7.0",
]
engines = [
  "presidio-analyzer>=2.2",
  "scrubadub>=2.0",
  "spacy>=3.7",
  "stanza>=1.8",
  "gliner>=0.2",
  "transformers>=4.38",
]
llm-guard = ["llm-guard>=0.3.11"]
gliner = ["gliner>=0.2"]
benchmark = [
  "presidio-analyzer>=2.2",
  "scrubadub>=2.0",
  "spacy>=3.7",
  "stanza>=1.8",
  "gliner>=0.2",
  "llm-guard>=0.3.11",
  "transformers>=4.38",
  "tqdm>=4.66",
  "numpy>=1.24",
]
crypto = ["cryptography>=41.0"]
# OPTIONAL asymmetric (Ed25519) signing for the gate_v1.json control-path
# artifact (S2-05). The DEFAULT signer/verifier is pure-stdlib HMAC-SHA256 with
# ZERO new dependencies; this extra is needed ONLY for the optional Ed25519
# envelope variant (lazy-imported, never a hard import on the default path).
gate-signing = ["cryptography>=41.0"]
cli = ["typer>=0.12", "rich>=13.0", "pyyaml>=6.0"]
datasets = ["pii-anon-datasets>=1.0.0"]
# S7-01 (DC-14): native-format reader backends. The PDF reader is pure-stdlib
# (no extra); OCR + DICOM are lazy-imported and fail LOUD naming these extras
# when absent (NFR-026 — no silent recall loss).
ocr = ["pytesseract>=0.3", "Pillow>=10"]
dicom = ["pydicom>=2.4"]
swarm-ml = ["xgboost>=2.0", "scikit-learn>=1.4", "numpy>=1.24"]
swarm-train = [
  "xgboost>=2.0",
  "scikit-learn>=1.4",
  "numpy>=1.24",
  "datasets>=2.14",
  "tqdm>=4.66",
]
# Claim-grade Bayesian Bradley-Terry rating tier (bayes-bt, S3-03). NUTS sampler
# stack — heavy, platform-specific wheels; the engine is import-safe without them
# (lazy import) and only *sampling* requires this extra.
bayes-eval = [
  "numpyro>=0.13",
  "jax>=0.4",
  "arviz>=0.17",
  "numpy>=1.24",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
pii_anon = [
  "benchmarks/matrix/*.json",
  "engines/expert_manifest_*.yaml",
  "engines/expert_manifest_*.json",
  "eval_framework/baselines/*.json",
]

[tool.pytest.ini_options]
addopts = "-q -m \"not performance\" --cov=pii_anon --cov-report=term-missing --cov-fail-under=84"
testpaths = ["tests"]
markers = [
  "performance: performance and SLA checks",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Environment variables must be set before importing torch/transformers.
"src/pii_anon/evaluation/competitor_compare.py" = ["E402"]
# sys.path setup and offline env patching must precede library imports.
"scripts/run_composite_evaluation.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["pii_anon"]

# Optional dependencies — not installed in every environment.
[[tool.mypy.overrides]]
module = [
  "pyarrow",
  "pyarrow.parquet",
  "pandas",
  "sentence_transformers",
  "sklearn.*",
  "presidio_analyzer",
  "presidio_analyzer.*",
  "spacy",
  "spacy.*",
  "stanza",
  "stanza.*",
  "gliner",
  "gliner.*",
  "scrubadub",
  "scrubadub.*",
  "llm_guard.*",
  "transformers",
  "transformers.*",
  "typer",
  "typer.*",
  "rich",
  "rich.*",
  "xgboost",
  "xgboost.*",
  "datasets",
  "datasets.*",
  "pii_anon_datasets",
  "pytesseract",
  "PIL",
  "PIL.*",
  "pydicom",
  "numpyro",
  "numpyro.*",
  "jax",
  "jax.*",
  "jaxlib",
  "jaxlib.*",
  "arviz",
  "arviz.*",
]
ignore_missing_imports = true

# CLI module uses typer decorators which are inherently untyped in strict mode.
[[tool.mypy.overrides]]
module = "pii_anon.cli"
disallow_untyped_decorators = false

[tool.coverage.run]
source = ["src/pii_anon"]
branch = true
omit = [
  "src/pii_anon/swarm_datasets.py",
  "src/pii_anon/swarm_train.py",
  "src/pii_anon/evaluation/pipeline.py",
]

[tool.coverage.report]
fail_under = 84
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@abstractmethod",
  "\\.\\.\\.",
]
