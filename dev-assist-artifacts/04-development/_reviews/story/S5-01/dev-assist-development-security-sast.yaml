findings:
  - id: security-S5-01-01
    severity: OBSERVATION
    location: src/pii_anon/eval_framework/attacks/__init__.py:67-69
    description: |
      The reid runners join the sandbox allow-list via an import-time IN-PLACE
      mutation of `DEFAULT_ATTACK_REGISTRY` (`DEFAULT_ATTACK_REGISTRY[_name] =
      _runner`). The annotation on that object is `Final[Mapping[str, AttackCallable]]`
      (sandbox.py:376), but the underlying object is a runtime-mutable plain `dict`
      — the `Final[Mapping]` is type-level only, so nothing prevents a later in-process
      caller from injecting an arbitrary (non-allow-listed) runner into the shared
      registry at runtime.

      ASSESSMENT (the scrutiny mandate): this is NOT a breach and NOT a regression.
      Verified by probe:
        * Same-object identity — `attacks.DEFAULT_ATTACK_REGISTRY is
          sandbox.DEFAULT_ATTACK_REGISTRY` is True, so the merge is visible to every
          consumer: `run_attack_under_sandbox`, `AttackSandbox.__init__`, and the
          `spec.load_attack_spec` lazy-default path all resolve against the merged dict.
        * Determinism / idempotency — re-running the merge loop is a no-op (keys+values
          stable, len stays 3); no double-registration.
        * No override — the S5-04 `reconstruction_attack_score` runner survives
          (disjoint keys: `reid_baseline` + the dotted-reid name vs the dotted-recon
          name); the recon entry is not rebound to the reid runner.
        * No skip path — importing the submodule `attacks.sandbox` directly always
          executes the parent `attacks/__init__` first (Python import semantics), so the
          merge can never be bypassed; the runner is present whenever sandbox is importable.
        * No new dynamic-import vuln — the merge is a literal dict assignment; `reid.py`
          contains zero `importlib`/`__import__`/`import_module`/`getattr`-routing
          (verified). A spec still selects code ONLY by an allow-listed key; a crafted
          `attack_kind` cannot select a non-allow-listed runner (kind is metadata; the
          runner allow-list is the gate — `runner="os.system"` is refused by
          `load_attack_spec`).
      The mutability of `DEFAULT_ATTACK_REGISTRY` is a PRE-EXISTING property of the
      byte-identical S5-04 substrate (it was already a plain `dict`); S5-01 reuses the
      same channel and does NOT widen the surface. Logged to monitor, not to block.
    suggested_resolution: |
      No change required for S5-01. If/when the substrate is hardened, prefer exposing
      the allow-list as a read-only view (e.g. `types.MappingProxyType`) with a single
      sanctioned `register_runner()` registration API, so the `Final[Mapping]` contract
      is enforced at runtime rather than type-level only. That is a substrate-layer
      (sandbox.py) change and out of scope for this off-limits-byte-identical story.
    references:
      - dev-assist-artifacts/04-development/02-stories/sprint-5/S5-01-reid-attack-protocol.md#2a
      - src/pii_anon/eval_framework/attacks/sandbox.py

  - id: security-S5-01-02
    severity: OBSERVATION
    location: src/pii_anon/eval_framework/attacks/reid.py:139-161
    description: |
      NFR-016 non-strippable caveat (A6): `ReidSuccessMetrics.__post_init__` refuses a
      blank/whitespace-only/non-str caveat (raises `ValueError`); the dataclass is
      frozen so normal reassignment (`m.caveat = ""`) is blocked; `as_outcome()` always
      re-emits the caveat and returns a FRESH dict each call (mutating the returned
      Mapping cannot corrupt the frozen source — verified). The single residual bypass
      is `object.__setattr__(m, "caveat", "")`, which succeeds — but that is the inherent
      escape hatch frozen dataclasses themselves use for `__init__`, available against
      ANY frozen dataclass, and is well outside the realistic NFR-016 threat (an exporter
      constructing or mutating metrics with a missing caveat — both already blocked).
      The production outcome path is single (the only `return {` is inside `as_outcome`;
      the runner calls `metrics.as_outcome()`), so every exported privacy outcome carries
      the caveat. No breach.
    suggested_resolution: |
      No change required. The `__post_init__` re-assertion + frozen-reassignment guard
      cover the realistic strip vectors; an `object.__setattr__` bypass is not a
      meaningful hardening target at this layer. Monitor only.
    references:
      - dev-assist-artifacts/04-development/02-stories/sprint-5/S5-01-reid-attack-protocol.md#A6

