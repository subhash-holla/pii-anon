findings:
  - id: axiom-S5-01-01
    severity: OBSERVATION
    location: src/pii_anon/eval_framework/attacks/reid.py:148
    description: |
      NFR-016 (AX adjacency) — `ReidSuccessMetrics.as_outcome()` returns a plain
      MUTABLE `dict`, so the non-strippable anti-anonymity caveat is non-strippable
      from the SOURCE object (frozen dataclass; `__post_init__` refuses blank, A6
      proven; the method re-emits `caveat` on every call) but a downstream caller
      could `del outcome["caveat"]` on the returned mapping after the fact
      (verified live: `del o["caveat"]` succeeds while `m.as_outcome()` still
      re-emits it). For S5-01's surface the MUST is satisfied: every exported
      metric the library itself emits carries the caveat, and the sandbox-exported
      artifact (`AttackResult.outcome`) carries it intact at emission. This is a
      hardening observation, not a violation — the axiom is upheld at every point
      the library controls.
    suggested_resolution: |
      Optional Pass-2 hardening only (do NOT block S5-01): return an immutable view
      from `as_outcome()` (e.g. `types.MappingProxyType(dict(...))`) so the caveat
      cannot be removed even from a copy of the exported mapping, closing the
      non-strippability guarantee end-to-end at the artifact boundary. Track on the
      S5-02 protocol-consumer story where the real Tier-3 adversary serialises
      outcomes.
    references:
      - dev-assist-artifacts/00-axioms/project-axioms.yaml#AX-pii-anon-001
      - dev-assist-artifacts/04-development/02-stories/sprint-5/S5-01-reid-attack-protocol.md#RISK-5

