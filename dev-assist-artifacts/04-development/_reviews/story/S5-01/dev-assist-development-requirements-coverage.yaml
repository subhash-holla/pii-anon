findings:
  - id: coverage-S5-01-01
    severity: OBSERVATION
    location: dev-assist-artifacts/02-requirements/traceability-matrix.md:25
    description: |
      NFR-016 ("100% of exported privacy artifacts carry the anti-anonymity
      caveat") is a cross-cutting MUST the traceability matrix attributes to TWO
      UC rows: UC-05/07/08 (FR-006/009/010, DATA-side pseudonymization artifacts)
      AND UC-09 (FR-011/012, the Tier-3 re-id artifacts). S5-01 honestly satisfies
      it for the CODE-side re-id privacy-artifact family it INTRODUCES
      (ReidSuccessMetrics / as_outcome) — verified non-strippable end-to-end. It
      does NOT, and correctly does not claim to, certify the DATA-side
      pseudonymization-integrity artifacts (cross-repo, `DATA:` dep). This is the
      correct partial-satisfaction reading for an invariant-style MUST, but the
      matrix's NFR-016 verification cell is not yet split by producing surface, so
      a later reader could mistake S5-01's claim for whole-invariant closure. No
      action required of S5-01; flagged so the epic/sprint coverage snapshot tracks
      NFR-016 as "code-side re-id surface VERIFIED (S5-01); DATA-side pseudonym
      surface pending its own producing story" rather than globally DONE.
    suggested_resolution: |
      No change to S5-01. At the epic/sprint coverage gate, record NFR-016 as a
      per-surface invariant: re-id-artifact surface verified by S5-01
      (test_nfr016_a6_* + A7 end-to-end through the sandbox); DATA-side
      pseudonymization-artifact surface verified by its own producing story. Avoid
      marking NFR-016 globally DONE off S5-01 alone.
    references:
      - requirements-document.md#NFR-016
      - dev-assist-artifacts/02-requirements/traceability-matrix.md

