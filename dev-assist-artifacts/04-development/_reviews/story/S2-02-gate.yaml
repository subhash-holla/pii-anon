adversarial_close:
  workflow: wf_4664a0cd-f3a   # 3 break-probe refuters (verify-bypass / forge-fabricate / floor-defeat) + integration/SDO sweep; bar = 0 upheld
  rationale: "gate_v1.json is a control-path/privilege-escalation artifact (the S2-05 hardening exists precisely for it); the story made the close a DoD item; security-sast PRIMARY + axiom-compliance concurred. Standing catch-net per SO-10/SO-11 (the 5/5 gate is necessary-but-not-sufficient for security-sensitive control-path work)."
  result: RECLOSE_PASS   # 0 upheld refutations; the catch-net found NO hole this time (a clean control-path close)
  upheld_refutations: 0
  refuters:
    - attack: "VERIFY-BYPASS — obtain a usable production gate from a file without a real HMAC verify (flip-byte / wrong-key / factory key_ring=None / full file-read-path audit / AST-guard evasion)"
      broke: false
      detail: "HOLDS. Exactly ONE DistilledTopKGate construction (distilled_gate.py:280) fed DistilledGatePayload.from_payload(load_verified_gate(..., verify_on_load=True)); exactly TWO load_verified_gate call sites in the package (moe.py:411 + distilled_gate.py:277), BOTH verify_on_load=True; NO verify_on_load=False literal anywhere in production; the single file-read primitive is unconditionally HMAC-gated under the KeyRing trust root. The in-process direct constructor is out-of-threat-model (already-executing code) and not reachable from a file without verification."
    - attack: "FORGE/FABRICATE — make a malformed/forged gate be accepted OR propagate a bad weight / invented expert downstream"
      broke: false
      detail: "HOLDS. from_payload rejected 35+ malformed-but-correctly-signed payloads (NaN/±inf/-1.0/bool weights; every missing key; schema_version 2/'1'/1.0/True; weights-as-list; nested non-mapping; non-str keys incl. via a custom Mapping subclass; temperature<=0/NaN; empty/int oracle_hash). Proved the SIGNATURE layer is NOT the catch-net (NaN/Infinity survive json+verify → only the shape validator rejects — defense-in-depth as designed). Through a REAL route(): a phantom gate expert is structurally ignored (adjust() iterates base → ids==base ids); all-zero → _normalize_weights None → base fallback; overflow impossible (base∈[0,1] × finite ≥0 factor); every output finite ∧ ≥0 ∧ Σ=1.0 ∧ ids⊆base. The v2 seam raises GatePayloadError at construction on a NaN-bearing signed gate; gate_path-without-key_ring raises."
    - attack: "FLOOR-DEFEAT (AX-003) — make an advisory gate drop a checksum-gated regex-oss shared span end-to-end, or break determinism"
      broke: false
      detail: "HOLDS. 19 hostile-gate variants + a 400-trial fuzz against the REAL FloorProjectingFusion(MoEFusionStrategy(... MoERouter(gate=hostile) ...)) — in EVERY case the floored span survived + the gated path was deterministic. Decisive V16: with min_expert_weight=0.0 (inner floor removed) AND the gate zeroing regex-oss, the inner merge GENUINELY drops the cluster (inner output []), yet the final output still carries the span via SharedLayerProjector re-injection (is_shared_floor=True) — the projector is the independent sole-survivor authority. The gate has NO payload field able to reconfigure the floor (DistilledGatePayload exposes only schema_version/gate_feature_version/oracle_hash/temperature/weights — zero overlap with shared_engine_id/projector). 2 refuter-self-identified FALSE ALARMS (not defects)."
  sweep:
    suite_line: "3291 passed, 15 skipped, 0 failed (exit 0; full run, 616s)"
    sdo_verdict: "NOT_YET"
    sdo_binding_constraint: "canonical_claim_run=False (G7 certified-run gate)"
    primitives_byte_identical: true   # moe_gate_signing.py + moe.py + competitor_compare.py + floor_fusion.py + shared_layer.py
    ruff_mypy_clean: true
    new_issues: []
  methodology_note: "A clean close (0 upheld) does NOT mean the close was unnecessary — it independently confirmed the verify-on-load entry-gate, the no-fabrication validator, and the advisory-floor bound under live attack (35+ forge probes / 19 floor variants / 400-trial fuzz / full file-read-path audit). The catch-net stays standing for any future control-path-artifact change."

