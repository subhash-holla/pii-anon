    encrypted_store.py + its test touched). traceability / axiom-compliance iter-1 APPROVE carried forward (no FR/NFR/trace
    change; the fixes strengthen AX-006 no-raw-PII-persist + NFR-014/015 integrity; AX-002/AX-004 not regressed). Mirrors the S4-CS-01 iter-2 pattern.
