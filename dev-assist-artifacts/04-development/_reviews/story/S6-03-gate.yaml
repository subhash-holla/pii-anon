findings:
  - id: SAST-S603-OBS-1
    severity: OBSERVATION
    status: ACCEPTED
    location: src/pii_anon/tokenization/encrypted_store.py (module docstring) + S6-03 §2/§5
    description: >
      Documented conscious residual: the keyed blind index HMAC(index_key, scope‖token) reveals EQUALITY of
      (scope,token) pairs (needed for O(1) lookup). Equality over derived pseudonyms, NOT PII; index_key is
      DEK-derived and never persisted, so a .db-only attacker cannot compute it. A no-equality-leak deployment
      can flip to the documented decrypt-and-scan (O(n)) switch-point. No breach.
  - id: SAST-S603-OBS-2
    severity: OBSERVATION
    status: REVIEWER-ERROR-CORRECTED
    location: S6-03 Evidence (cryptography version string)
    description: >
      security-sast flagged the Evidence string "cryptography 48.0.0" as possibly wrong (it measured 44.0.3).
    remediation: >
      Orchestrator verified ground truth directly in the .venv: `python3 -c "import cryptography;
      print(cryptography.__version__)"` → 48.0.0. The Evidence is ACCURATE; the reviewer's 44.0.3 reading came
      from a non-.venv interpreter probe. No Evidence change needed. (Both ≥41 satisfy the [crypto] extra; the
      AEAD primitives are advisory-clean on both.)
