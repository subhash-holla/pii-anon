  iter2_observations_accepted:   # security-sast, non-blocking, pre-existing, NOT confidentiality/reversal breaks; Pass-2 hardening notes
    - "created_at is outside the AAD (a raw UPDATE can forge it) but it gates nothing (not key selection / TTL / bucketing) — purely an audit timestamp."
    - "Post-rotation mixed-key partial-read: reopening with a provider that unwraps only the newer key id silently OMITS older-key rows from list_by_scope (results non-empty → fail-loud guard skipped). Part of the dual-version rotation-grace model; omits rows, NEVER reveals wrong plaintext."
  iter2_reviewers_carried: >
    Re-reviewed security-sast (PRIMARY) → APPROVE on the AAD-fold + the FIX-A parity tests + FIX-C; requirements-coverage
    re-confirmed via the integration sweep (new_tests_present=true — the committed AST + nonce tests exist and pass).
