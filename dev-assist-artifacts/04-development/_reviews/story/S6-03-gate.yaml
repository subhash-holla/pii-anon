# But the completeness critic returned FAIL on test-parity + two non-confidentiality integrity gaps:
iter2_adversarial_close:
  trigger: "Workflow wqhzndsp3 — completeness=FAIL (no upheld confidentiality refutation; S6-03 plaintext-recovery + integrity refuters both broken=false)."
  gaps_closed:
    - id: REQCOV-S603-PARITY
      severity: substantive (unverified DoD §12 clauses)
      description: "DoD §12 (d) no-unsafe-deserialization / (e) no-subprocess/shell-out / (g) random-96-bit-nonce-no-reuse were TRUE by construction but had ZERO committed tests (vs S2-05's 4 AST sink tests + S5-04's 8)."
      remediation: "FIX-A: committed AST sink-scan test (mirrors the strengthened S5-04 matcher incl. getattr/import_module indirection) + non-vacuity meta-guard + json-only-serializer pin + nonce-distinctness (60 puts + 50 re-puts all distinct)."
      status: REMEDIATED-AND-REVERIFIED
    - id: SEC-S603-AAD-COLUMNS
      severity: integrity-hardening (NOT a confidentiality/forgery break — each surfaced only the row's OWN genuine plaintext)
      description: "scope_index + expires_at were NOT in the AEAD AAD, so a raw sqlite3 UPDATE could mis-bucket a row's list_by_scope audit-enumeration (scoped get stayed blind-index-bound, not foolable) or resurrect a logically-expired row."
      remediation: "FIX-B: AAD now binds key_id|blind_index|version|scope_index|expires_at (None as a distinct canonical sentinel); all read paths decrypt BEFORE the TTL short-circuit (a tampered-then-expired row fails loud, can't be masked by TTL). scope_index-relocation + expires_at-extend/NULL now raise TokenStoreIntegrityError; legitimate rows still decrypt."
      status: REMEDIATED-AND-REVERIFIED
    - id: REQCOV-S603-WRONGKEK
      severity: SHOULD (NFR-015 consistency)
      description: "Under a wrong KEK, scoped get() raised but list_by_scope() returned [] silently."
      remediation: "FIX-C: list_by_scope now fails loud (via _raise_if_unreversible, no lock re-acquire) when rows exist but no key unwraps; genuinely-empty scope still []; count() no-scope stays a documented deliberate raw COUNT(*) (cardinality already leaked by file size) + pinned test."
      status: REMEDIATED
  reclose:
    workflow: wy3urfrhc
    result: "reclose_pass=true; S6-03 re-refuter all_closed (scope_index-relocation/expires_at-tamper/wrong-KEK-list_by_scope all RAISE; not-plaintext-on-disk + single-byte-tamper + determinism + legit-rows + rewrap_all all still hold); security-sast re-review APPROVE (0 new MAJOR+); integration PASS."
