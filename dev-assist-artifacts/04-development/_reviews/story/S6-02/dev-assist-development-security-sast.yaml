resolved_findings:
  - id: security-S6-02-01
    severity: MAJOR
    status: CLOSED
    iteration_opened: 1
    iteration_closed: 2
    location: src/pii_anon/agentic/interception.py:195
    title: Keyless-hash surrogate offline re-identification on the persisted G5 ledger
    remediation_commit: 83b73bf
    what_was_required: |
      The default masker derived every surrogate token id from a KEYLESS blake2b
      digest of (scope, entity_type, raw_value). In iteration 1 I DEMONSTRATED
      offline dictionary re-identification: from the surrogate-only ledger +
      a candidate dictionary + the low-cardinality scope/entity (no secret) I
      recovered the synthetic raw email `jane.roe@example.test`. Because these
      surrogates flow into the persisted G5 `InterceptionLedger.as_dict()` (a
      shareable audit artifact + the S6-05 Sankey source), a keyless hash of
      low-entropy PII was a weak crypto primitive for a pseudonym on a PII
      surface. Required fix: key the surrogate (preferred), reusing the canonical
      keyed primitive, while preserving within-key determinism.
    how_it_was_fixed: |
      The surrogate token id is now a KEYED HMAC-SHA256
      (`_keyed_token_id`, line 195/217:
      `hmac.new(surrogate_key, msg, hashlib.sha256).hexdigest()[:12]`).
      The keyless blake2b is GONE (grep-confirmed: no blake2b/md5/sha1 anywhere
      in the module). `FourChannelGuard` gained `surrogate_key: bytes | None =
      None` (line 382); `None` mints a random per-instance key via
      `secrets.token_bytes(32)` at CONSTRUCTION in `__post_init__` (line 401-405),
      threaded into the default `_DefaultMasker(key)`. The module-level singleton
      `_DEFAULT_MASKER` was removed (it could not carry a per-instance key).
    independent_reverification: |
      I RE-RAN my exact iteration-1 break-probe against the live remediated code:
        * ATTACK 1 (the iter-1 recovery) — built a G5 ledger with the
          secure-by-default random key, then ran the identical keyless-blake2b
          dictionary attack over a candidate set CONTAINING the true value
          `jane.roe@example.test`: recovered == [] (RESISTED). The same probe
          recovered the raw value in iter-1; it now lands nothing.
        * ATTACK 2 (wrong-key brute over a small guessed keyspace x dictionary):
          hits == [] (RESISTED).
        * Key-dependence: same raw value under two keys -> two different
          surrogates (TRUE).
        * Reproducible path: `_keyed_token_id(K1,...)` reproduces the surrogate
          ONLY with the exact key (FR-030 byte-identical given key/scope) — TRUE.
        * Secure-by-default: two default-constructed (no-key) guards produce
          DIFFERENT surrogates for the same value (each mints its own random
          key) — TRUE; so the deployed G5 ledger is non-dictionary-reversible
          even when the operator injects nothing.
        * Determinism reconciliation: a fixed injected key yields byte-identical
          masked_text + records across instances — TRUE. `secrets` is
          CONSTRUCTION-ONLY: AST of the module proves `mask` / `_keyed_token_id`
          / `_make_surrogate` (the per-mask path) never reference `secrets`;
          `random`/`uuid`/`time` appear nowhere.
      Result of the re-run break-probe: MAJOR security-S6-02-01 is CLOSED.
    no_new_crypto: |
      No new primitive was rolled. `_keyed_token_id` is byte-for-byte the
      canonical keyed-pseudonym construction already in the tree:
      `hmac.new(key, msg, hashlib.sha256)` == `tokenization/providers.py:69`
      (`DeterministicHMACTokenizer.tokenize`) == `encrypted_store.py:366/371`
      (the blind index `HMAC(index_key, scope|token)`). Same domain-separated
      `\x1f`-delimited message shape as the blind index. No new attack vector
      introduced: the only new input is the construction-time key (CSPRNG via
      `secrets`); the emitted artifact is still only the hex image of a keyed
      digest.
    test_pins: |
      `test_fr026_a11_keyed_surrogate_resists_dictionary_reidentification`
      (PASSED) is the genuine inverse of my break-probe and is NON-VACUOUS — it
      asserts: two keys -> different surrogates (line 482); the keyless
      dictionary guess over a candidate set containing the true value yields
      `keyless_matches == []` (line 511, reproducing the OLD keyless construction
      exactly); the wrong-key guess `!=` target (519); only the exact key `==`
      target (521).
      `test_fr026_a11_default_key_is_random_per_instance_secure_by_default`
      (PASSED) pins two default guards -> different surrogates (line 540).
      A9 reconciled: `test_ax002_a9_deterministic_replay` injects a fixed
      `surrogate_key` for byte-identical replay; `test_ax002_a9_no_
      nondeterministic_imports_on_path` bans random/uuid/time outright, allows
      secrets/os for construction-time keying, and AST-asserts the per-mask
      functions never reference `secrets`. Both PASSED.
    references:
      - src/pii_anon/tokenization/providers.py
      - src/pii_anon/tokenization/encrypted_store.py
      - requirements-document.md#FR-026
      - requirements-document.md#AX-006

