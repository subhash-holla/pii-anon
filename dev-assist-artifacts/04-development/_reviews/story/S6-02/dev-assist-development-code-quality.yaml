  --- KEYED-SURROGATE CHANGE ASSESSMENT (code quality) ---

  _keyed_token_id / hmac.new usage: CLEAN. The function uses hmac.new (stdlib,
  no new dependency) with hashlib.sha256 as the digestmod — the same primitive
  family as DeterministicHMACTokenizer and encrypted_store.py's blind index.
  No new crypto is introduced; the keyless BLAKE2b is removed. The function
  signature (surrogate_key, scope, entity_type, raw_value) -> str is idiomatic,
  has a full docstring explaining the two key properties (within-key determinism
  and without-key non-reversibility), and is correct.

  _DefaultMasker refactor: CLEAN. Converted from stateless module-level singleton
  to a keyed instance (surrogate_key injected at construction, stored in
  __slots__). FourChannelGuard gains the surrogate_key: bytes | None field;
  __post_init__ mints secrets.token_bytes(32) when None is passed (secure-by-
  default). The test confirms two default-constructed guards produce different
  surrogates. All mypy-clean.

  secrets scoping: CORRECT. secrets.token_bytes is called ONLY in
  FourChannelGuard.__post_init__ (construction-time). The per-mask path
  (_DefaultMasker.mask, _keyed_token_id, _make_surrogate) is proven free of
  any secrets reference by the A9 AST test that walks each of those functions'
  ASTs and asserts no Name node is 'secrets'. AX-002 determinism-under-a-fixed-
  key is preserved.

  _keyed_token_id imported in tests (line 51): OBSERVATION only. Importing a
  module-private (_-prefixed) function in a test is a mild convention violation
  (the function is in __all__ indirectly via inclusion in test fixtures), but the
  import is load-bearing for A11's exact-key reconstruction probe
  (test_fr026_a11_keyed_surrogate_resists_dictionary_reidentification line 518-521:
  verifying that only FIXED_KEY reproduces the target surrogate). This is an
  accepted pattern for security proof-of-correctness tests that must verify the
  internal primitive directly. Not a blocking finding.

  New A11 tests: WELL-FORMED. Both test_fr026_a11_* carry FR-026 prefixes,
  document the security guarantee clearly, and the probe logic is correct: (1)
  two different keys yield different surrogates for the same input; (2) the
  attacker's keyless blake2b offline guess does not match the keyed HMAC
  surrogate; (3) wrong key misses, right key hits.

