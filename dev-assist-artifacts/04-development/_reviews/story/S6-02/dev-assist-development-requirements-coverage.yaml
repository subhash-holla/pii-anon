    - intercept_all covers EVERY channel: A7
      (test_fr025_a7_intercept_all_covers_every_channel) — one ChannelResult per
      channel, each masked (raw absent), per-channel records;
      set(results) == set(AgentChannel).
    - least-privilege: A5 (test_ax006_a5_trace_never_reverses_by_default +
      _reversible_only_on_explicit_opt_in) — TRACE persists 0 rows by default;
      `intercept` reaches `_persist` ONLY when channel in reversible_channels;
