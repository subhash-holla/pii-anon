      the real S6-03 AEAD store.

  FR-026 (persist NO raw PII to any channel after masking, AX-006 — MUST):
  VERIFIED in-tree.
    - no-raw-persist invariant RAISES on leak (headline): A4
      (test_fr026_a4_no_raw_persist_raises_on_masked_text_leak +
      _via_intercept_all + _error_is_pii_anon_error_subclass) — a deliberately
      lying `_LeakyMasker` (emits a record but leaves the raw value in
      masked_text) is caught; `_assert_no_raw_pii` RAISES NoRawPIIPersistError
      (loud, never a silent pass), through both `intercept` and `intercept_all`;
      the error subclasses PiiAnonError. This is real teeth, not a tautology —
      the raw set is derived from the masker's reported source span and the lie
      is the still-present source text.
    - no-plaintext record: A3 (test_fr026_a3_record_has_no_plaintext_field) —
      frozen dataclass; fields == surrogate-only metadata set; no field VALUE
      contains the raw PII; mutation raises FrozenInstanceError.
    - surrogate-only persist: A6 (test_fr026_a6_memory_persists_only_surrogate)
      against the REAL S6-03 EncryptedSQLiteTokenStore — stored token == the
      surrogate (AEAD ciphertext at rest), read-back is never the raw value.
    - surrogate-only ledger (G5 shape): A8
      (test_fr026_a8_ledger_surrogate_only_g5_shape) — as_dict() JSON-serializes
      with NO raw PII in the blob + per-channel counts.

