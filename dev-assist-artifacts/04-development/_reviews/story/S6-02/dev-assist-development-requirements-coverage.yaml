  - id: coverage-S6-02-02
    severity: OBSERVATION
    location: src/pii_anon/agentic/interception.py:391
    description: |
      Scope-honesty note on FR-026 (no finding against this story; documents the
      exact in-tree-vs-Pass-2 seam so a later reader does not over-read the
      MUST). `_assert_no_raw_pii` scans for raw survival ONLY over the set of raw
      values the masker SELF-REPORTS (`_known_raw_values` walks `result.records`
      and takes each reported source span). It therefore catches a masker that
      LIES by reporting-a-record-but-leaving-the-raw-text (A4, the headline) and
      a masker that lets raw bleed into a persisted record (A3/A8). It does NOT,
      by construction, catch raw PII that the detector NEVER reported at all
      (a recall miss). That residual — real-detector-recall against a live agent
      runtime / real transcript residual — is EXACTLY the AGENT_SIMULATED Pass-2
      boundary the story declares, so the mechanism-under-test is honestly
      scoped, not over-claimed. Flagging only so the Pass-2 protocol explicitly
      owns "detector-miss residual leakage", not just "transcript residual".
    suggested_resolution: |
      No change required for S6-02. When the AGENT_SIMULATED Pass-2 is scheduled
      (live-runtime gate), ensure its sample-size protocol covers detector-recall
      misses (raw PII present but un-reported), not only transcript-residual
      leakage of already-detected entities — so the Pass-2 confirm/invalidate
      genuinely closes FR-026's live half.
    references:
      - dev-assist-artifacts/02-requirements/requirements-document.md#FR-026
      - dev-assist-artifacts/04-development/02-stories/sprint-6/S6-02-four-channel-interception.md

