summary: >
  S6-02 remediation (83b73bf) is axiom-clean and the keyed-surrogate change does
  NOT regress any axiom in scope. The re-review FOCUS — AX-002 (determinism) under
  the new keyed/HMAC path with construction-time RNG — HOLDS with margin, verified
  by independent probes (not just by re-running the executor's tests):

  (1) DETERMINISM PER FIXED KEY. With an injected fixed surrogate_key, two
  independent FourChannelGuard instances produce byte-identical masked_text,
  identical InterceptionRecord tuples, AND identical ledger as_dict() across all
  four channels (independently reproduced). _keyed_token_id under a fixed key is a
  pure function: 2000 repeat calls yield exactly ONE distinct token id. The
  per-mask path (HMAC over (scope, entity_type, raw)) carries no per-call RNG or
  clock. test_ax002_a9_deterministic_replay now correctly INJECTS FIXED_KEY into
  both guards and asserts byte-identical masked output + records (the FR-030
  reproducible path); the prior keyless-default formulation would have masked a
  re-introduced nondeterminism, so pinning the key is the right reconciliation.

  (2) CONSTRUCTION-TIME RNG IS SOUND (does not violate per-mask determinism).
  secrets.token_bytes is invoked ONCE in FourChannelGuard.__post_init__ to mint a
  per-instance key when none is injected (secure-by-default). Independent AST
  walk of the real module confirms: random/uuid/time are absent (banned); the ONLY
  function referencing the name `secrets` is __post_init__; the ONLY secrets.*
  attribute used is token_bytes; and the per-mask functions mask /
  _keyed_token_id / _make_surrogate reference `secrets` ZERO times. The
  reconciliation in test_ax002_a9_no_nondeterministic_imports_on_path — ban
  random/uuid/time outright, ALLOW secrets/os for construction-only key gen, and
  AST-assert the per-mask path never names `secrets` — is exactly the correct and
  minimal carve-out. Construction-time key generation is a per-instance setup
  choice, not part of the input->output mask transform, so AX-002's "identical
  inputs (including the key) -> identical outputs" contract is preserved; the
  axiom was always per-key (a pseudonymization key is part of the reproducible
  input set, cf. FR-030 / the canonical DeterministicHMACTokenizer).

  (3) THE KEYING DID NOT BUY DETERMINISM AT THE COST OF RE-IDENTIFIABILITY.
  Independently confirmed the inverse property the security MAJOR demanded: the
  same raw value under two different keys yields different surrogates, and the
  attacker's exact offline keyless-BLAKE2b dictionary guess over a candidate set
  that CONTAINS the true synthetic value never reproduces the keyed surrogate.
  AX-002 and the de-identification fix are jointly satisfied.

  UNCHANGED INVARIANTS RE-CONFIRMED (the remediation touched only the surrogate
  derivation + docstrings + test names, so these should be untouched — verified):
  AX-006 least-privilege — TRACE/PROMPT/TOOL_IO each write 0 rows to an injected
  AEAD store; only MEMORY (reversible) persists exactly 1; the persisted
  TokenMapping.plaintext == surrogate (surrogate->surrogate, raw never reaches the
  store). FR-026 no-raw-persist — an independent leaky masker still RAISES
  NoRawPIIPersistError. No-plaintext — InterceptionRecord fields are surrogate-only
  {channel,entity_type,surrogate,span_start,span_end,scope}; ledger JSON carries
  no raw email/phone. AX-001 — fixtures use only the reserved example.test TLD
  (no real-domain literal). AX-003 adjacency clean — diff scope is exactly the 3
  expected files; no detection/fusion/recall-floor/SDO file touched.

  iter-1 OBS-2 (the store holds surrogate->surrogate, so the surface as-built
  cannot reverse-to-raw) is now HONESTLY DOCUMENTED: _persist and the
  reversible_channels param doc describe "surrogate -> surrogate linkage record"
  (plaintext column receives the surrogate, raw never written) and explicitly
  defer true authorized reversal-to-raw to FR-027 (session pseudonyms), out of
  S6-02 scope. OBS-2 is RESOLVED. iter-1 OBS-1 (fragment re-injection by a
  hypothetical adversarial custom masker is out of the whole-value invariant's
  scope) is UNCHANGED by this remediation and CARRIED FORWARD as a threat-model
  note for S6-04 / a real engine masker — it remains a depth-of-invariant
  observation, not an axiom violation for any path this story ships.

  Gates re-verified in the working tree: ruff clean; mypy src/pii_anon clean (133
  files); agentic suite 24 passed (A1-A11 + 5 renamed edge); targeted axiom subset
  (A11/A9/A5/A6/A3/A8) 10 passed. Protected/user-WIP byte-identical: orchestrator
  0afc6dee…, competitor_compare 7cae16c8… (memory-stable), errors 1d3ed9f7…,
  encrypted_store 132fa3c1…, reidentification c2367ed6…, providers b891811d… —
  all unchanged; SDO gate competitive_supremacy.py untouched. No axiom finding at
  MINOR or above; the single carried-forward item is an OBSERVATION.

findings:
  - id: AX-S602-OBS-1
    severity: OBSERVATION
    axiom: AX-pii-anon-006
    location: src/pii_anon/agentic/interception.py (_known_raw_values + _assert_no_raw_pii)
    title: "[carried from iter-1, unchanged by remediation] no-raw-persist invariant keys on the FULL spanned value — a fragment re-injection by an adversarial CUSTOM masker is not scanned"
    description: >
      Unchanged by 83b73bf (the remediation touched surrogate derivation, not the
      invariant). _known_raw_values forbids, per record, the EXACT source
      substring source_text[span_start:span_end]; _assert_no_raw_pii checks
      `raw in masked_text`. This catches the story's headline threat — a masker
      that LIES and leaves the WHOLE raw value un-masked (verified RAISES, both
      iter-1 and iter-2). It does NOT catch a hypothetical adversarial custom
      masker that masks the full span but re-injects a FRAGMENT of the raw value
      in the clear. NOT an axiom violation: (a) the in-tree _DefaultMasker never
      partial-re-injects — it replaces each full match with a surrogate; (b) the
      invariant's documented contract is the whole spanned values masking CLAIMS
      to have removed, which is internally consistent; (c) a production
      engine-backed masker that fragments a value would be a masker bug surfaced
      by that masker's own tests. AX-006's passing criterion (no raw PII written
      post-masking) is met for every path this story ships. Raised so the threat
      model is explicit when S6-04 (BYO-SDK adapter) or a real engine masker lands.
    suggested_resolution: >
      No change required for S6-02. Track as a threat-model note for S6-04 /
      real-masker integration: either (a) re-run the default detectors over
      masked_text as a backstop and forbid any detector match the masker did not
      account for, or (b) document in the ChannelMasker Protocol docstring that
      implementations MUST NOT emit any substring of a masked raw value, making
      fragment-safety an explicit contract the invariant assumes.
    blocking: false

resolved_findings:
  - id: AX-S602-OBS-2
    severity_was: OBSERVATION
    axiom: AX-pii-anon-006
    resolution: DOCUMENTED
    note: >
      iter-1 OBS-2 (reversible channel persists surrogate->surrogate via
      plaintext=surrogate, so the surface as-built cannot reverse-to-raw and a
      consumer expecting store.get(surrogate).plaintext == raw would be surprised)
      is resolved by honest docstrings in 83b73bf: _persist now reads "Persist a
      surrogate -> surrogate linkage record … the plaintext column … receives the
      surrogate … no raw value is ever written … True surrogate -> raw reversal is
      FR-027 (session pseudonyms) and is out of S6-02's scope", and the
      reversible_channels param doc matches ("surrogate -> surrogate linkage
      record … plaintext column receives the SURROGATE, never raw PII"). The
      stronger-than-promised AX-006/FR-026 reading (no raw at the store at all) is
      now stated, not implicit. Verified read-back plaintext == surrogate, never
      the raw email.

