findings:
  - id: code-quality-story-01
    severity: MAJOR
    location: src/pii_anon/eval_framework/metrics/selective_risk.py:390
    description: >
      mypy --strict (as configured in pyproject.toml [tool.mypy] strict = true)
      reported "Missing type parameters for generic type 'ndarray' [type-arg]"
      on the return annotation of `_monotone_risk_coverage`. The function was
      declared to return `tuple[np.ndarray, np.ndarray]` but under strict mode
      bare `np.ndarray` without type parameters is a type error.
    status: RESOLVED
    resolution_commit: 92a3356
    resolution_note: >
      `_monotone_risk_coverage` return annotation is now
      `tuple[npt.NDArray[np.float64], npt.NDArray[np.float64]]` via
      `import numpy.typing as npt` (line 48). `python3 -m mypy src/pii_anon
      --strict` exits "no issues found in 129 source files". 0 errors (was 2).

  - id: code-quality-story-02
    severity: MINOR
    location: src/pii_anon/eval_framework/metrics/selective_risk.py:418
    description: >
      Same bare `np.ndarray` type-arg violation on the parameter annotations of
      `_abstention_table(coverage: np.ndarray, risk: np.ndarray)` — mypy
      --strict flagged both as [type-arg]. Bundled with finding 01.
    status: RESOLVED
    resolution_commit: 92a3356
    resolution_note: >
      `_abstention_table` parameters are now
      `coverage: npt.NDArray[np.float64], risk: npt.NDArray[np.float64]`
      (line 422 in current HEAD). Both bare `np.ndarray` occurrences are fully
      parametrized; grep confirms no remaining bare `np.ndarray` in the function
      signatures of this file.

  - id: code-quality-story-03
    severity: MINOR
    location: src/pii_anon/eval_framework/metrics/selective_risk.py:158
    description: >
      `SelectiveRiskReport.per_class_aurc` field docstring did not state the
      discrete estimator used (per-point mean vs. trapezoidal integral), leaving
      callers without sufficient precision to interpret the value.
    status: RESOLVED
    resolution_commit: 92a3356
    resolution_note: >
      A 3-line comment is now present immediately above `per_class_aurc` (lines
      159-161): "AURC discrete estimator: mean of the per-point cumulative risk
      over the confidence-ordered coverage grid (approx np.trapz under uniform
      1/n spacing); Geifman & El-Yaniv 2017." The clarification precisely
      identifies the estimator and its relationship to the trapezoidal
      approximation.

