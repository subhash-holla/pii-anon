notes: |
  REQUIREMENTS-COVERAGE VERDICT: APPROVE. No silent gap; no over-claim.

  Every MUST/SHOULD in this story's declared scope is EITHER fully verified
  (named test + passing run) OR explicitly deferred-with-tracked-successor.
  Verified live in this review (tests/test_moe_sla_bias.py, 41/41 cases GREEN,
  run with --no-cov to bypass the repo-wide 84% single-file artifact;
  the 84%-not-reached line when running one file is a coverage-config artifact,
  NOT an S2-04 failure):

    * NFR-009 (SHOULD, full-swarm latency per profile): MECHANISM verified
      (A1 `test_nfr009_bias_shifts_selection_mass_toward_cheaper_expert`;
      A9 power-tier-trap pair). The COMMITTED NUMERIC p50/p95/p99 ceilings are
      explicitly DEFERRED to S7-04 + Pass-2 — stated identically in
      provisional_status, the Implements row, the Blocks row, S5 Non-goals,
      and the Evidence block. This is the correct "partial-with-tracked-
      successor" posture for a SHOULD whose numeric threshold is deferred — it
      is NOT claimed "fully verified". HONEST.

    * NFR-010 (SHOULD, throughput floor >=5,000 rec/sec): LEVER verified
      (A2 top-k promotion toward the lightweight path; A10 valid-output-under-
      bias). The real-hardware throughput number + per-class transparency are
      DEFERRED to S7-04 + Pass-2 (matrix row 16). The bias is a coherent
      throughput lever (demoting costly experts out of the truncated top-k).
      HONEST (see coverage-S2-04-02).

    * NFR-026 (SHOULD, graceful degradation): default-off byte-identity FULLY
      VERIFIED in the swarm-routing path. A7 pins route() == an INDEPENDENT
      static-softmax oracle (re-derived from spec, not importing production
      route) for both `sla_bias=None` and `SLABias(strength=0.0)` over a
      10-entity representative set; A8 pins invalid-cost (NaN/inf/-inf/neg/bool/
      str/None/list) -> "no cost" never raising (0 unhandled exceptions); A10
      pins the bare route_all() call site against the same oracle. I verified
      the oracle is a faithful apples-to-apples comparator: `min_expert_weight`
      pruning lives on MoEFusionStrategy, NOT on MoERouter.route() (moe.py:750,
      795), and route() has no min-weight pruning — so the oracle's
      scores->sort->top_k->floor-swap->softmax mirrors route() exactly. The
      byte-identity claim has real teeth. The only NFR-026 note is the matrix-row
      bookkeeping lag (coverage-S2-04-01, MINOR).

  EVIDENCE / DoD HONESTY: the Evidence block faithfully separates in-tree-real
  (mechanism, ingress, tie-break, advisory-floor/confidence invariance, default-
  off byte-identity vs SYNTHETIC registries) from Pass-2 (beta toward the real
  1522/753/200 budgets + numeric ceilings). The DoD's single open box is the
  story-gate APPROVE (this review) — every substantive box is checked with
