closed_findings:
  - id: security-S2-04-01
    severity: MAJOR
    status: CLOSED
    location: src/pii_anon/moe.py (_is_finite_number) via _latency_cost -> _latency_cost_by_id -> MoERouter.route()
    closed_by: 3e9fbe7
    verification: |
      CLOSED — re-ran the exact iteration-1 break-probe live in-tree. The local
      `_is_finite_number` now wraps the `math.isfinite(value)` call in
      `try/except (OverflowError, ValueError): return False`, so an unbounded
      Python `int` (the one numeric type that passes `isinstance(value,(int,float))`
      yet exceeds the C-double range) is treated as "not a usable finite number"
      -> `_latency_cost` returns `None` -> "no cost", never raising.

      Live probe (cost = 10**400 AND -(10**400)):
        _is_finite_number(10**400)              -> False  (was: OverflowError)
        _latency_cost(spec w/ 10**400)          -> None
        MoERouter(reg_with(10**400),
                  sla_bias=SLABias(strength=100.0)).route("PERSON_NAME")
          -> NO RAISE; distribution finite ∧ all w>=0 ∧ Σ=1.0;
             the bad-cost expert coerced to "no cost" (its weight == the clean
             equal-strength expert's, abs_tol 1e-12).
        Same for -(10**400).

      A8 now parametrizes both `10**400` and `-(10**400)`
      (`test_nfr026_invalid_latency_cost_treated_as_no_cost`, moe.py test lines
      553-554) AND the `_latency_cost` helper table
      (`test_latency_cost_helper_coercion`, lines 789-790) asserts each coerces
      to `None`. Both green. The `_latency_cost` docstring contract ("never
      raises"), story A8, and the gate's untrusted-input criterion now hold over
      the full int range. Verified the fix touched ONLY moe.py's local copy — no
      other module's `_is_finite_number` was altered.

  - id: security-S2-04-02
    severity: MINOR
    status: CLOSED
    location: src/pii_anon/moe.py (SLABias.__post_init__) guarding _apply_sla_bias
    closed_by: 3e9fbe7
    verification: |
      CLOSED — `SLABias` gained a `__post_init__` (validation-only; the dataclass
      stays `frozen=True`, no field mutation) that raises `ValueError` when
      `strength` is non-finite or `< 0`, OR `reference_ms` is non-finite or
      `<= 0`. The degenerate/poisoning configs can no longer be constructed, so
      neither a `ZeroDivisionError` (reference_ms == 0.0) nor a NaN-poisoned
      distribution (NaN strength/reference_ms escaping the no-gate static-softmax
      path, which does not route through `_normalize_weights`) can reach `route()`.

      Live probe (7 hostile kwargs, each fail-fast at construction):
        SLABias(reference_ms=0.0)        -> ValueError   (was: ZeroDivisionError downstream)
        SLABias(reference_ms=-1.0)       -> ValueError
        SLABias(reference_ms=nan)        -> ValueError   (was: [nan,nan] distribution)
        SLABias(reference_ms=inf)        -> ValueError
        SLABias(strength=-1.0)           -> ValueError   (no silent bias-inversion)
        SLABias(strength=nan)            -> ValueError   (was: [nan,nan] distribution)
        SLABias(strength=inf)            -> ValueError
      Legitimate surface NOT over-rejected:
        SLABias() / SLABias(strength=0.0) / SLABias(strength=2.0, reference_ms=3.0)
        all construct fine (β>=0 inert boundary preserved).

      Pinned by `test_nfr026_slabias_rejects_hostile_config_at_construction`
      (7 params) + `test_nfr026_slabias_valid_configs_construct_fine`. Both green.

