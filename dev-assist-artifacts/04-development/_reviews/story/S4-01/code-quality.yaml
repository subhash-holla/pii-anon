findings:
  - id: code-quality-S4-01-01
    severity: MINOR
    location: tests/test_deid_families.py:252-275
    description: >
      Two test functions — test_anonymization_clean_output_has_low_reidentification_risk
      and test_anonymization_leaky_output_raises_reidentification_risk — carry neither
      an FR/NFR/AX ID in the function name nor one in the docstring body. All other
      22 tests in the file embed at least one such ID. These two are clearly exercising
      the anonymization family (implicitly FR-006 / AX-004) but the pin is absent from
      both name and docstring text.
    suggested_resolution: >
      Add a docstring annotation citing the FR/NFR: e.g. prefix the docstring with
      "[UNIT-TEST] FR-006 / AX-004: ..." to match the rest of the file's style.
    status: open

