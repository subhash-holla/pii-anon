findings:
  - id: code-quality-S504-01
    severity: MINOR
    location: src/pii_anon/eval_framework/attacks/sandbox.py:102
    description: >
      Public method SandboxPolicy.from_spec (classmethod) has no docstring. The class
      SandboxPolicy is exported in __all__ and is the primary construction path from a
      validated AttackSpec; the from_spec method is a named public surface item.
      Pattern #4 (missing pydoc on a public surface item) applies here.
    suggested_resolution: >
      Add a one-line docstring, e.g.:
        """Derive a least-privilege SandboxPolicy from a validated AttackSpec."""
    status: open

  - id: code-quality-S504-02
    severity: MINOR
    location: src/pii_anon/eval_framework/attacks/sandbox.py:124
    description: >
      Public method SandboxPolicy.assert_no_network has no docstring. The adjacent
      assert_no_network_value method (line 119) does carry a docstring, making the
      no-arg form a visible documentation gap on the exported SandboxPolicy class.
    suggested_resolution: >
      Add a one-line docstring, e.g.:
        """Raise unless this policy's network posture is 'deny'."""
    status: open

  - id: code-quality-S504-03
    severity: MINOR
    location: tests/test_attack_sandbox.py:1, tests/test_attack_spec_loader.py:1
    description: >
      No test function name embeds an FR or NFR ID (pattern #6: test name does not pin
      an FR/NFR ID). The story implements FR-011, FR-013, NFR-012, NFR-013, NFR-024 /
      AX-001, FR-026 / AX-006. All 67 test names use acceptance-criteria labels (A1-A8)
      which are story-local and not traceable to the requirements catalogue without
      cross-referencing the story text. The module-level docstrings mention FR-011 /
      FR-013 in the RED commit message but not in any test name.
    suggested_resolution: >
      Embed at least the primary FR IDs in key test names or docstrings — e.g., rename
      test_a5_well_formed_synthetic_attack_runs_to_completion to include fr_011_fr_013
      in the name, or add a pytest mark / docstring pinning the relevant FR/NFR IDs.
      At a minimum, the two module docstrings already contain FR-011 / FR-013 references,
      so adding them to the acceptance-gate test names (A5, A4) would suffice.
    status: open

