    requirement: FR-011, FR-013 (MUST, eval)
    where: src/pii_anon/eval_framework/attacks/sandbox.py:359-361
    detail: >-
      The allow-list registry contains ONLY
      pii_anon.harness.attack.reconstruction_attack_score (a synthetic,
      side-effect-free reconstruction runner; harness/attack.py:6-12 is pure
      over in-memory strings, no I/O, no network, no real PII). No real Tier-3
