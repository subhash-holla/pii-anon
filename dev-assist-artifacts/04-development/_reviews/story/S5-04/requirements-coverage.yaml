      correct and honest state: traceability-matrix.md:27-28 records both
      bodies as DATA-blocking on S6 (assemble_paired_set for Tier-3 / canary
      splits for MIA), so they cannot land here. The story honestly scopes the
      bodies as deferred successors (story header "Implements ... its runner
      must execute sandboxed"; §5 non-goals lines 47-48). No false DONE claim.
      Recorded as an OBSERVATION only so the epic/release gate carries the
      explicit open-successor: FR-011 + FR-013 remain UNVERIFIED-at-body until
      a successor story lands a real runner that executes via
      run_attack_under_sandbox. Not actionable for this story.
    disposition: accept
  - id: RC-S504-002
    severity: OBSERVATION
    title: >-
      RLIMIT_AS self-degrades to a recorded audit note on this darwin host;
      real memory-cap enforcement is honestly Pass-2.
    requirement: NFR-012 / NFR-013 substrate (resource isolation), FR-026/AX-006
    where: src/pii_anon/eval_framework/attacks/sandbox.py:213-242
    detail: >-
      The address-space (memory) rlimit is refused by darwin and degrades to a
      recorded platform_limit_unavailable audit note (never a silent no-op),
      with the wall-clock watchdog as the reliable primary terminator. This is
      marked honestly as AGENT_SIMULATED / Pass-2 (story line 71, §5 line 48)
      and is NOT a coverage gap for THIS story (the substrate + the fail-loud
      degrade path are both proven: A4 test_a4_audit_note_recorded_when_rlimit_unavailable
      and the _FakeResource branches test_rlimit_applied_branch_records_applied_audit
      / test_rlimit_absent_branch_records_unavailable_note pin both the applied
      and the degrade arcs). Flagged so the successor story that runs a real
      memory-hungry attack body must confirm a real OS-level memory cap
      (seccomp / cgroup) at Pass-2 — it is NOT verified by the in-process guard.
    disposition: accept
