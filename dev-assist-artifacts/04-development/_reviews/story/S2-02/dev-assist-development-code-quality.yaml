  Closed-form distillation math (independently verified):
    - The proof sketch in gate_distillation.py module docstring is correct.
      Minimising sum_i w_i * CE(p, t_i) over scalar p yields stationary point
      p* = (sum w_i * t_i) / (sum w_i) — the weighted mean. Gradient at p* is
      1.44e-15 (machine epsilon), CE is strictly higher at p* ± 0.1, confirming
      a minimum. The production `_temperature_softmax` and the test's
      `_expected_softmax` are algebraically identical and produce byte-identical
      results (verified numerically).
    - `_temperature_softmax`: max-subtraction before math.exp is numerically
      stable; the `# pragma: no cover` on the degenerate fallback is correct
      (max-subtraction forces at least one exp(0)=1.0 term, making total > 0
      unreachable for any finite input).

  Public API documentation:
