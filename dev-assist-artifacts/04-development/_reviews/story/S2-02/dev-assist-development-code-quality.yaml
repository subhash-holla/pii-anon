findings:
  - id: code-quality-S2-02-01
    severity: OBSERVATION
    location: src/pii_anon/routing/distilled_gate.py:237-243
    description: |
      The `adjust` early-return guard `if not cell:` correctly handles an empty
      MappingProxyType (falsy), but the comment "Unknown entity type, or an empty
      opinion" slightly conflates two distinct cases: (1) entity_type not in
      weights at all (cell is None, which is also falsy), and (2) entity_type
      present but with an empty cell dict (cell is an empty MappingProxyType,
      also falsy). Both are handled correctly by the same guard — the behaviour
      is right, but the comment could be more precise ("None or empty cell").
      Non-blocking style note only.
    suggested_resolution: |
      Optionally split the comment into: "# entity_type absent from gate weights
      (None) or present with an empty cell — both mean no opinion (identity)."
      No code change needed; the guard is correct for both sub-cases.

  - id: code-quality-S2-02-02
    severity: OBSERVATION
    location: src/pii_anon/fusion.py:727
    description: |
      `key_ring: Any = spec.key_ring` uses `Any` to side-step the import cycle
      (`fusion.py` cannot import `KeyRing` without a circular dependency chain).
      The justification is clearly documented in the `FusionBuildSpec` docstring
      ("Typed loosely to avoid an import cycle; a v2 factory narrows it as
      needed") and the field-level comment in `_build_distilled_moe`. This is the
      same cycle-avoidance pattern used by `FusionBuildSpec.key_ring: Any | None`
      (line 489). Pattern is consistent and documented; no action required.
    suggested_resolution: |
      No change needed. If the import cycle is resolved in a future story (e.g.,
      by a `TYPE_CHECKING` guard or a protocols module), the `Any` annotation
      could be tightened to `KeyRing | None`. Defer to that follow-up.

