findings:
  - id: axiom-S2-02-01
    severity: OBSERVATION
    location: src/pii_anon/routing/distilled_gate.py:224
    description: |
      AX-006 (least-privilege) observation, non-blocking. `DistilledTopKGate.adjust`
      accepts a `RouteContext | None` for Protocol conformance but routes on
      `entity_type` alone (documented in the docstring: "deterministically
      independent of `context` today"). This is correct and intentional for this
      story — it actually STRENGTHENS AX-002 (one fewer input the payload depends
      on) and keeps the gate's capability surface minimal (a dict lookup + a
      multiply, no file/network/exec). Logged only so a future feature-conditioning
      story (S2-03/S2-04 which consume the advisory signal) is on notice that
      widening `adjust` to read `context` re-opens the determinism + replay-equality
      teeth (A6) and must re-thread the `seed`/feature-version provenance.
    suggested_resolution: |
      No change required this story. When a later story conditions `adjust` on
      `context`, add a replay-equality property test over the context-bearing path
      and stamp the context feature-version into the payload so AX-002 stays pinned.
    references:
      - dev-assist-artifacts/00-axioms/project-axioms.yaml#AX-pii-anon-006
      - dev-assist-artifacts/00-axioms/project-axioms.yaml#AX-pii-anon-002

