    description: |
      The direct `DistilledTopKGate(payload)` constructor (and the
      `DistilledGatePayload(...)` dataclass) remain importable. Adjudication:
      this is NOT a verify-on-load bypass and NOT a privilege-escalation surface.
      `DistilledTopKGate.__init__` accepts an already-validated
      DistilledGatePayload and reads NO file; the dataclass's sanctioned
      construction path is `from_payload`, which validates shape and is invoked
      ONLY at distilled_gate.py:280 inside `load_distilled_gate`, downstream of
      `load_verified_gate(..., verify_on_load=True)`. A grep over src/ confirms
      exactly one `DistilledTopKGate(` call site (the verified one) and zero
      `verify_on_load=False` tokens anywhere in src/. The direct constructor is
      reachable only from already-executing in-process code that owns the process
      — directly analogous to S2-05's adjudicated `verify_on_load=False` offline-
      tooling escape. An attacker who can call this constructor in-process has
      already achieved code execution, against which an artifact-signature
      boundary offers no additional protection. Logged for the audit trail only.
    suggested_resolution: |
      No change required. The verify-on-load boundary is the correct and
      sufficient control for the file-reading threat model. (If desired purely
