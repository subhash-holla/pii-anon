# ── ITER-2 AMENDMENT (adversarial-close-driven) ──────────────────────────────────────────────
# The iter-1 5-reviewer gate (below) returned 5/5 APPROVE, but the between-work-streams adversarial
# close Workflow (wqhzndsp3) caught a MAJOR the gate missed, plus a hardening gap:
iter2_adversarial_close:
  trigger: "Workflow wqhzndsp3 (6 refuters + integration + completeness critic) — 1 UPHELD refutation + completeness recommendations."
  major_found:
    id: SEC-S504-PATHTRAVERSAL
    severity: MAJOR
    description: >
      Path allow-list bypass: spec._is_within_allowed / SandboxPolicy.assert_path_allowed used
      PurePosixPath.relative_to (purely lexical, never collapses '..'), so
      assert_path_allowed('/grant/../../../etc/passwd') with allowed_paths={'/grant'} RETURNED the path
      (no raise) — defeating BOTH the runtime shim AND the load-time A6 `*_path` guard. Demonstrated reading an
      /etc/passwd-shaped target + a real symlink escape. The A6 acceptance ("a path outside allowed_paths is
      rejected") was UNVERIFIED for '..' traversal (only sibling-prefix was tested). All 5 iter-1 reviewers missed it.
    remediation: >
      RED e4cf199 → GREEN 6deacbe. FIX-1: canonicalize BEFORE the shared _components_contained boundary check —
      runtime assert_path_allowed now os.path.realpath(candidate AND each root) (collapses '..' + resolves
      symlinks); load-time _is_within_allowed now os.path.normpath (lexical, deterministic, no FS dependence).
      +12 net-new tests pin: multi-depth '..' traversal (runtime + load-time) raises; real symlink-escape raises;
      within-grant '..' + legit-in-grant + grant-root still ALLOWED; sibling-prefix still DENIED.
    status: REMEDIATED-AND-REVERIFIED
  hardening_found:
    id: SEC-S504-A2-INDIRECTION
    severity: MINOR (over-claim)
    description: >
      The A2 AST guard was non-vacuous but EVADABLE: getattr(os,'<shellcall>') / import_module('<subprocess>')-routed
      indirection slipped past the fixed-literal node-name matcher (a shell-out runner ran rc=0 in a CUSTOM registry).
      The guard is a TEST-ONLY source-hygiene pin over the 3 repo attacks/*.py files (honestly AGENT_SIMULATED;
      runtime OS-confinement is Pass-2) but the §3 A2 / §12 DoD "proves ZERO ... call signatures" wording over-claimed.
    remediation: >
      FIX-2 (same RED/GREEN): strengthened _scan_unsafe_call_signatures to also flag getattr/import_module/__import__
      calls whose string arg is a forbidden sink (+ 3 routed-sink meta-guards + a no-false-positive guard); §3 A2 +
      §12 DoD wording softened to "pins out naive/contiguous AND getattr/import_module-routed signatures over the
      repo-owned source (TEST-ONLY source-hygiene pin; runtime OS-confinement is Pass-2)".
    status: REMEDIATED
  reclose:
    workflow: wy3urfrhc
    result: "reclose_pass=true; 2/2 re-refuters all_closed (0 still-broken — the exact traversal probe RAISES, symlink-escape RAISES, no over-rejection, A2 indirection caught); security-sast re-review APPROVE (0 new MAJOR+); integration PASS."
    suite: "3097 passed / 15 skipped / 9 deselected / 0 failed (exit 0)"
    coverage: "86.85% (≥84); attacks/__init__.py 100%, sandbox.py 99%, spec.py 100%"
    quality: "ruff clean; mypy --strict clean / 127 files"
    owned_tests: "87 (iter-1 67 + iter-2 +20)"
    tdd: "RED e4cf199 (path-traversal + A2-indirection pins fail on iter-1 code — refuter reproduced the old lexical bypass) → GREEN 6deacbe → docs 52e9bef; RED-before-GREEN git-confirmed"
  iter2_reviewers_carried: >
    Re-reviewed the dimension whose finding drove the remediation: security-sast (PRIMARY) → APPROVE on both fixes
    (canonicalization sound + deterministic; strengthened guard non-vacuous + not over-broad; no new sink; scope-clean,
    only the 4 owned files). code-quality re-confirmed via the integration sweep (RED-before-GREEN git-verified, ruff +
    mypy clean, scope-disciplined). traceability / requirements-coverage / axiom-compliance iter-1 APPROVE carried
    forward (the iter-2 change is within the security-sast blast radius + strengthens AX-006 least-privilege path
    containment; no FR/NFR/trace change; the A6 acceptance is now genuinely test-pinned). Mirrors the S4-CS-01 iter-2 pattern.
# ── end iter-2 amendment ; the iter-1 record (which stands, with the gap noted above) follows ──

