         read it. Pinned by `test_pass2_full_census_reference_present_and_not_gate_read`
         (tests:561), which asserts the block's fields AND that
         "pass2_full_census_reference" is not in the gate-read system-names set.

      4. The two-run relationship is now an explicit, tested trace edge:
         `test_gate_read_systems_are_fresh_not_census_literals` (tests:541) asserts the
         gate-read `systems[*].recall/precision` == the separately-surfaced fresh
