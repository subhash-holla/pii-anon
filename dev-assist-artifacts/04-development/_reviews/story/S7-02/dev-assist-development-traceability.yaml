         implemented under the dispatch's `pass2_full_census_reference` name). It lives
         OUTSIDE `systems` and is NEVER gate-read: a grep of competitive_supremacy.py +
         competitor_compare.py for `2761a27` / `148994` / `0.784583` / `0.680213` /
