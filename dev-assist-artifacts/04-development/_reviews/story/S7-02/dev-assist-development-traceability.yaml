         `detection_scope="in-tree-fresh-<n>-records"` (canonical_run.py:412-413), pinned
         by `test_detection_scope_labels_fresh_run_honestly` (tests:592).

      The honest consequence (correctly NOT a fabrication): on the fresh in-tree metrics
