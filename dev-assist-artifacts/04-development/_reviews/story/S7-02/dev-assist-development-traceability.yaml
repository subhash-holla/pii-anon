      while `_attach_provenance` stamped a DIFFERENT, FRESH run (scope=data-v2.0.0,
      git_sha=4ddcae6, sample_size=8). The headline metrics did not trace to the run the
      provenance described, and no trace edge linked them to their true 2761a27 source.

      VERIFICATION THAT IT IS NOW CLOSED (read the remediated code + ran the suite):

      1. The gate-read metrics now trace to the SAME fresh run the provenance describes.
         `_assemble_base_payload` (canonical_run.py:312) reads recall / precision /
         per_entity_recall from `report.systems` VERBATIM (lines 344-354, 361-363) — the
         output of the ONE `compare_competitors` run produced in
         `produce_canonical_artifact` (canonical_run.py:1016). `composite_score` is the
         REAL `compute_composite` (line 370) over those FRESH detection-quality axes with
         a FIXED, equal-across-systems reference speed (_REFERENCE_LATENCY_MS /
         _REFERENCE_DOCS_PER_HOUR) — NOT a census literal. The SAME `report` then yields
         `actual_sample_size = max(s.samples ...)` (canonical_run.py:1030), which
         `_attach_provenance` stamps as `sample_size` (canonical_run.py:1045-1047). So the
         provenance `sample_size` and the headline metrics are now BOTH derived from the
         identical fresh `report` — the iter-1 "provenance sample_size:8 vs headline
         recall from the 2761a27 census" mismatch is now STRUCTURALLY IMPOSSIBLE.

      2. The scope-laundering machinery is REMOVED, not relabelled. `_CENSUS_PROFILES`,
         `_DetectionProfile`, and the `_*_PER_ENTITY` literals no longer exist as module
         attributes (confirmed by grep AND by `test_no_census_literals_module_attribute`,
         canonical_run.py tests:581, which asserts `not hasattr(cr, "_CENSUS_PROFILES")`).

      3. The documented census is now a TRANSPARENT `pass2_full_census_reference` block
         (canonical_run.py:185, attached at :404) carrying `source_git_sha=2761a27...`,
         `source_record_count=148994`, `source_canonical_claim_run=False`,
