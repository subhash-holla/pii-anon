  --- build_fusion gate_path/key_ring hardcoded-None seam: HONESTLY DISCLOSED ---
  In build_fusion's v2-consult block, the assembled FusionBuildSpec sets
  gate_path=None, key_ring=None, top_k=3 (fusion.py). This is NOT a hidden gap:
  (1) build_fusion's PUBLIC signature genuinely does not expose gate_path /
  key_ring / top_k (confirmed: only mode/weights/min_consensus/entity_weights/
  iou_threshold) — so there is nothing to source them FROM yet without widening
  the public API; (2) the inline comment states it explicitly: "gate_path /
  key_ring default to None, top_k to the builtin default — they are carried, not
  yet sourced from build_fusion's public signature, keeping it stable." The
  FusionBuildSpec CARRIES the fields (so the carrier is forward-compatible for
  S2-02) while the wiring-in is deferred. This is a seam-now / wire-in-S2-02
  deferral honestly disclosed, exactly as the dispatch asked me to verify — not
  an over-claim.

