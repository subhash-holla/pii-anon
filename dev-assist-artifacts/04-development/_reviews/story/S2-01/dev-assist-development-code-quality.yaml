findings:
  - id: code-quality-S2-01-01
    severity: MINOR
    location: tests/test_moe_router_seam.py:408
    description: |
      Typo in test function name: `test_fr018_routingate_protocol_is_a_fusionstrategy_independent_symbol`
      has `routingate` (missing `g`). The surrounding names all spell `RoutingGate` correctly; this
      is an accidental keystroke omission, not a deliberate abbreviation.
    suggested_resolution: |
      Rename to `test_fr018_routinggate_protocol_is_a_fusionstrategy_independent_symbol`
      (insert the missing `g`). No behaviour change needed.

  - id: code-quality-S2-01-02
    severity: MINOR
    location: tests/test_fusion_construction_seam.py:150-225
    description: |
      The six `test_audit_*` test functions (A7 drift-guard tests) do not embed a
      `fr_NNN` or `nfr_NNN` requirement ID in their names, unlike every other test
      in both owned files (which consistently prefix `fr018_`, `nfr005_`, `nfr026_`,
      `ax002_`, `ax003_`). The audit tests trace to FR-018 / DC-02 / D5 per the
      story's §3 A7 cell. The omission breaks the naming convention that lets grep
      quickly find coverage for a specific FR.
    suggested_resolution: |
      Rename e.g.:
        test_audit_single_source_builtin_modes_constant_exists
          → test_fr018_audit_single_source_builtin_modes_constant_exists
        test_audit_every_advertised_builtin_mode_is_constructible
          → test_fr018_audit_every_advertised_builtin_mode_is_constructible
      (and so on for the remaining four). The prefix `test_fr018_audit_` signals both the
      FR and the [AUDIT] tag.

