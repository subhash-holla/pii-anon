findings:
  - id: axiom-S2-01-01
    severity: OBSERVATION
    location: src/pii_anon/fusion.py:build_fusion (v2-consult branch, ~line 625-635)
    description: |
      The v2 construction seam carries `gate_path` and `key_ring` on
      `FusionBuildSpec`, but `build_fusion` hardwires both to `None` when it
      assembles the spec (and `top_k=3`), since they are not yet sourced from
      build_fusion's public signature. This is correct and INTENTIONAL for a
      seam-only story (documented in the inline comment "carried, not yet sourced
      ... keeping it stable"), and it is the SAFE default w.r.t. AX-002 / the
      S2-05 verify-on-load trust boundary: no attacker-controllable gate path can
      flow through the v2 path in this story (empirically confirmed: `gate_path=None`
      / `key_ring=None` literal in the assembly; `_CUSTOM_FACTORIES_V2` starts empty).
      Logged purely so the successor wiring (S2-02) is reminded that a real
      gate path arriving through this seam must re-enter the fail-closed
      verify-on-load path (verify_on_load=True), never be trusted raw.
    suggested_resolution: |
      No change required in this story. When S2-02 wires a learned gate through
      register_fusion_strategy_v2, ensure the FusionBuildSpec.gate_path is
      consumed ONLY via load_verified_gate(..., verify_on_load=True) + a real
      KeyRing, preserving the S2-05 fail-closed boundary (and keep determinism:
      no unsigned/unverified payload reaching route()).
    references:
      - dev-assist-artifacts/00-axioms/project-axioms.yaml#AX-pii-anon-002
      - dev-assist-artifacts/04-development/02-stories/sprint-2/S2-01-widen-route-and-construction-seam.md

  - id: axiom-S2-01-02
    severity: OBSERVATION
    location: tests/test_moe_router_seam.py:test_ax003_hostile_gate_cannot_drop_floored_shared_span (line 326-328)
    description: |
      A4's final survivor predicate asserts via an `or` between two acceptance
      conditions: floor-provenance ("shared_floor" in explanation) OR
      ("regex-oss" in f.engines). Independently verified that the floor-provenance
      branch is the one that actually fires here (the re-injected EnsembleFinding
      carries explanation="provenance=shared_floor: re-injected by
      SharedLayerProjector ..." and engines=["regex-oss"]), so the assertion is
      sound. The `or` is marginally looser than necessary — both disjuncts happen
      to hold for the floor-re-injected finding, so a future inner-strategy change
      that passed the span through WITHOUT the floor (engines containing regex-oss
      but no shared_floor tag) could still satisfy the predicate. The test is NOT
      vacuous (proven below), but tightening the assertion to require the
      floor-provenance marker would make it strictly pin re-injection, not mere
      survival.
    suggested_resolution: |
      Optional hardening (not blocking): assert that at least one survivor is
      `is_shared_floor(f)` True (import from routing.shared_layer) so the test
      pins floor RE-INJECTION specifically, not survival-by-any-means.
    references:
      - dev-assist-artifacts/00-axioms/project-axioms.yaml#AX-pii-anon-003

