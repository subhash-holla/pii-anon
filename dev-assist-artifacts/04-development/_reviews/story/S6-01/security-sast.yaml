summary: >
  PRIMARY reviewer. The privacy default-to-mask invariant (RISK-1) holds under
  adversarial probing: empty/whitespace/punctuation/symbol/NBSP/zero-width queries
  all yield ZERO retention; a candidate with neither an entity-alias match nor a
  surface-token overlap is provably impossible to retain. Subtractive-on-mask
  (RISK-2) is structural (exactly one decision per candidate; the gate only flips
  retain on baseline-masked candidates). No re-detection (RISK-3 — re + stdlib
  only). Fail-loud bound (RISK-6 — domain-named ValueError on length mismatch;
  rates always finite in [0,1]). Off-limits byte-identical; the SDO gate untouched
  (no SDO close). 11/11 (now 12/12) targeted tests pass.
findings:
