    severity: MINOR
    title: surface-token relevance can over-retain a PERSON_NAME on a common-word query (false-retention via token collision)
    where: src/pii_anon/policy/query_aware.py (surface_hit branch)
    disposition: PASS-2 NOTE (no in-loop code change, per the PRIMARY reviewer's explicit recommendation) — within the # SWITCH-POINT(DATA) representative-heuristic scope; privacy-SAFE direction (default is mask; requires the caller's literal token); satisfies the A6 shipped contract. Tracked in story §5 as a Pass-2 hardening for the DATA scorer (a common-word filter on short single-token surfaces + the FR-024 false-retention-rate metric at corpus scale). A stop-word filter without a corpus risks mis-masking a legitimately-queried person.
  - id: SEC-S601-02
    severity: OBSERVATION
    title: ASCII-fold tokenisation masks a homoglyph/non-Latin query token (privacy-safe)
    disposition: PASS-2 NOTE (story §5) — the privacy-safe direction (fails to retain → masks); a recall consideration for the DATA scorer, never a leak.
