findings:
  - id: code-quality-S6-05-01
    severity: MINOR
    location: tests/test_agentic_leakage_sankey.py:509
    description: |
      `test_ax001_a10_in_tree_payloads_are_inert_synthetic` (lines 495–518) contains
      `import builtins as _b` inside the function body (line 509), which is redundant
      because `builtins` is already imported at the module top-level (line 35). The
      function accesses `builtins.__import__` on line 502 using the top-level name, then
      re-imports the same module as `_b` four lines later and uses `_b` for the mutation
      and restoration. The two names refer to the same module object, so the test is
      correct, but the in-function import is an unnecessary PLC0415-class pattern (not
      caught by the default ruff rule set but would fire under `ruff check --select
      PLC0415`). It also makes the code harder to read: a reviewer must confirm that
      `real_import` captured before the alias and `_b.__import__` set inside `try`/
      `finally` are operating on the same object. The sibling test
      `test_fr029_a10_in_tree_payloads_without_datasets_extra` solves the same problem
      more cleanly using `monkeypatch.setattr(builtins, "__import__", _no_datasets)`.
    suggested_resolution: |
      Remove the `import builtins as _b` line (509) and replace the `_b` references
      with the top-level `builtins` name that is already imported. Alternatively,
      convert the test to use `monkeypatch: pytest.MonkeyPatch` exactly as
      `test_fr029_a10_in_tree_payloads_without_datasets_extra` does — that is the
      idiomatic, safer pattern and eliminates the try/finally boilerplate:
        monkeypatch.setattr(builtins, "__import__", _no_datasets)

  - id: code-quality-S6-05-02
    severity: MINOR
    location: src/pii_anon/agentic/leakage_sankey.py:314
    description: |
      `_ZERO_WIDTH` is assigned as a raw invisible Unicode literal `"\xe2\x80\x8b"`
      (U+200B ZERO WIDTH SPACE) with no inline comment identifying the codepoint. In
      most editors and in diff output the assignment reads as `_ZERO_WIDTH = ""` — an
      empty string — which makes the payload set look like a bug (a no-op transform).
      The `_homoglyph()` and `base64` transforms above are readable at a glance; only
      this one requires a byte-level inspection to understand.
    suggested_resolution: |
      Replace the invisible literal with an escape sequence and add a brief comment:
        _ZERO_WIDTH = "​"  # U+200B ZERO WIDTH SPACE (strip to recover)
      This makes the intent unambiguous in editors, diffs, and code review without
      any behaviour change.

