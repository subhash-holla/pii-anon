    location: dev-assist-artifacts/04-development/02-stories/sprint-6/S6-05-leakage-sankey-injection-resistance.md:51
    description: |
      FR-028 (MUST) traces to UC-22, and UC-22 names the leakage-Sankey channel
      taxonomy EXPLICITLY (04-use-cases.md:32): "per-channel leak counts
      (prompt/retrieval/tool/memory/output/trace)" — six SOURCE channels. FR-028's
      "leakage-Sankey, 6 channels" is therefore the UC-22 taxonomy, not an arbitrary
      node count. S6-05 implements the per-channel accounting over the FOUR S6-02
      AgentChannel sources (PROMPT/MEMORY/TOOL_IO/TRACE) + the {blocked, leaked}
      sinks — a 6-NODE graph, but only a 4-SOURCE taxonomy. The two UC-22 sources
      NOT covered are `retrieval` and `output`.

      The per-channel-count INTENT of FR-028 is genuinely met and verified for the 4
      implemented sources: A1 (test_fr028_a1_blocked_edges_sum_to_intercepted_total)
      pins blocked edges summing to the ledger total; A4
      (test_fr028_a4_blocked_edge_per_masked_record_on_its_channel) pins
      counts_by_channel() per source incl. the negative (TRACE absent when no
      record); A2 (test_fr028_a2_leaked_edge_when_known_value_survives_outbound)
      pins counts_by_channel()[PROMPT][LEAKED]==1 on the correct source channel; A5
      (test_fr028_a5_as_dict_renderer_shape_six_nodes +
      _links_aggregate_per_channel_target) pins the renderer shape + per-channel
      link aggregation. counts_by_channel() is directly exercised. The module is
      genuinely extensible — _SOURCE_CHANNELS derives from AgentChannel, so a wider
      source set plugs in without a module change (leakage_sankey.py:99).

      The COVERAGE concern is narrow and procedural: the story §5 defers the wider
      taxonomy ("widening the agent-channel source taxonomy beyond the S6-02 4
      channels ... that's a documented follow-up") but names NO successor story
      handle. A grep across all sprint-6/7 stories finds no story that adds the
      `retrieval`/`output` sources, so the deferral is unscheduled. This is a
      deferral-without-named-successor, not a silent gap (the story flags it openly
      in §Traces + §5), and the WIDER-VS-NARROWER channel-taxonomy RULING is owned
      by the traceability reviewer (per this reviewer's out-of-scope boundary and
      the story §9 division of labour). Flagged here as the coverage-side hook so it
      is not lost.
    suggested_resolution: |
      Either (a) record an explicit successor-story handle for the UC-22
      `retrieval`+`output` source channels (e.g. an S7 / post-MVP follow-up id) in
      story §5 and in the traceability matrix forward-row for FR-028, so the
      deferral is scheduled rather than open-ended; OR (b) defer to the traceability
      reviewer's ruling that the 4-source/6-node reading satisfies FR-028's
      per-channel-count intent for the MVP, in which case annotate FR-028's
      traceability row that the UC-22 6-channel taxonomy is partially covered
      (4/6 sources) with the residual two sources logged as a known follow-up. No
      production change is required to clear this finding — the per-channel
      mechanism is fully implemented and tested; only the deferral's successor
      handle is missing.
    references:
