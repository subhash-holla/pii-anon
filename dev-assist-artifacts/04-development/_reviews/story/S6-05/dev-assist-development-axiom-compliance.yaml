findings:
  - id: axiom-S6-05-01
    severity: OBSERVATION
    location: src/pii_anon/agentic/leakage_sankey.py:367-412
    description: |
      AX-002 determinism on the LIVE data path is upheld but rests on an UNTESTED
      structural assumption worth pinning. In this environment pii_anon_datasets IS
      installed, so score_injection_resistance takes the DATA branch of
      _load_payloads (build_payloads + INTENT_TAGS), NOT the in-tree fallback that
      A6/A10 exercise under monkeypatch. I independently verified the DATA path is
      deterministic: build_payloads is pure-stdlib (base64 + dataclasses), uses a
      FIXED INTENT_TAGS=("base64","ocr","zero_width"), a fixed CARRIER_TEMPLATES,
      and a fixed _OCR_MAP, with no clock/RNG (eval-data payloads.py:1-114) — two
      score_injection_resistance calls produced a byte-identical report
      (n_payloads=4, intent_tags=("base64","ocr","zero_width")). So determinism
      holds on BOTH paths today. HOWEVER, no S6-05 test pins the determinism of the
      DATA branch (A6 only covers whichever path is active, and the env that runs
      A6 with the extra PRESENT silently tests DATA, while the env that runs it
      ABSENT tests the fallback — neither test asserts which path it took). The
      AX-002 contract for this module therefore depends on an out-of-tree library's
      determinism that this story does not contract-test. This is an OBSERVATION,
      not a finding-with-teeth, because (a) the in-tree fallback determinism IS
      pinned (A6 under monkeypatch), and (b) the DATA library is itself AX-002/
      NFR-004-stamped at its own gate (S7-02). Raised so a future change to
      build_payloads (e.g. adding a randomized carrier) cannot silently break this
      module's AX-002 with the extra installed without a test here catching it.
    suggested_resolution: |
      No change required for S6-05 APPROVE. Optional hardening: add one
      [PROPERTY-TEST] that calls score_injection_resistance twice WITHOUT the
      monkeypatch (i.e. against whatever path is active in the running env) and
      asserts byte-identical reports — this pins the DATA branch's determinism
      when the extra is present, complementing A6's fallback-path pin. Alternatively
      assert that _load_payloads returns a tuple equal to itself across two calls
      regardless of branch. Either makes the AX-002 contract path-independent and
      catches an upstream build_payloads regression at THIS module's gate.

