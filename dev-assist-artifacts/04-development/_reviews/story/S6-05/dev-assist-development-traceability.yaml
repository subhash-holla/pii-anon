# ===========================================================================
# THE 4-vs-6 CHANNEL ADJUDICATION (the critical traceability call)
# ===========================================================================
channel_model_adjudication:
  question: "Does the 4-source/6-node reading satisfy FR-028's 'leakage-Sankey, 6 channels', or does FR-028 require 6 SOURCE channels (a wider taxonomy)?"
  what_fr028_says: "requirements-document.md:41 — 'Per-channel agentic leakage counts (leakage-Sankey, 6 channels)'. The counted noun is 'channels'; 'Per-channel ... counts' frames channels as the MEASURED SOURCES. A Sankey's blocked/leaked sinks are the tallies themselves, not channels one counts leakage 'per'. Read literally, '6 channels' most-naturally means 6 SOURCE channels."
  what_the_binding_design_says: "DC-13 — the design constraint S6-05 traces — specifies the taxonomy as '4-channel least-privilege (prompt/memory/tool-I/O/trace, AX-006)' TWICE (D-implementation-ready-design.md:23 table row AND :49 DECISION 3). There is NO 6-source taxonomy anywhere in the design. FR-025 (the upstream channel-set MUST) says 'all FOUR agent channels'. AgentChannel is contract-frozen at EXACTLY 4 (test_agentic_interception.py:131)."
  what_uc22_says: "UC-22 has no narrative beyond the FR-028 title line — no 6-channel enumeration to lean on either direction."
  what_s605_built: "A 6-NODE flow graph = the 4 AgentChannel source nodes (PROMPT/MEMORY/TOOL_IO/TRACE) + the blocked/leaked sinks, with PER-SOURCE-CHANNEL counts. _SOURCE_CHANNELS = tuple(c.value for c in AgentChannel) — a wider source taxonomy plugs in by widening AgentChannel, zero module change."
  ruling: ACCEPTABLE_INTERPRETATION_FOR_THIS_STORY_GATE
  ruling_rationale: >
    There is a GENUINE tension: FR-028's title '6 channels' read literally points at 6 SOURCE channels,
    which is WIDER than the 4 the design actually specifies. So the 4-source/6-node build is an
    INTERPRETATION, not a literal-text match. HOWEVER this is NOT a blocking coverage gap chargeable
    to S6-05, for three reasons: (a) the BINDING artifact S6-05 implements is DC-13, which is
    post-SME-sign-off and specifies EXACTLY 4 channels — S6-05 faithfully implements the binding
    design and cannot be required to invent 5th/6th SOURCE channels the design deliberately scopes
    out; the '6-vs-4' mismatch is a REQUIREMENTS-DOC <-> DESIGN discrepancy (the FR-028 title '6' was
    never reconciled to DC-13's '4'), i.e. a requirement-TEXT defect to backfill at source, not an
    S6-05 implementation defect. (b) The chain integrity the traceability dimension owns is intact:
    FR-028 exists, is MUST, is claimed, traces to DC-13, and has >=1 pinning test whose bodies assert
    the FR-028 INTENT ('per-channel agentic leakage counts') — the per-channel-counts core is
    delivered and tested. (c) The story DISCLOSES the reconciliation honestly (story Traces + §5
    non-goal + module docstring + RISK-2) and the taxonomy is genuinely EXTENSIBLE. This is the
    honest-disclosure-of-a-known-interpretation pattern, not a hidden gap. The unresolved literal
    '6-vs-4' numeric discrepancy is logged as a NON-BLOCKING MINOR (TRACE-S6-05-MINOR-2) to be
    reconciled at the SOURCE (amend FR-028's title to '4 source channels / 6-node flow graph' OR raise
    a documented follow-up to widen the source taxonomy if 6 sources are truly intended) — batched to
    the sprint gate. NOT charged as a MAJOR against S6-05.
  verdict_one_line: "4-source/6-node satisfies FR-028 for THIS story gate (faithful to binding DC-13, per-channel-counts intent met, honestly disclosed, extensible); the FR-028-title-'6'-vs-DC-13-'4' numeric mismatch is a real but NON-BLOCKING requirement/design-text discrepancy (MINOR, batched to sprint)."

