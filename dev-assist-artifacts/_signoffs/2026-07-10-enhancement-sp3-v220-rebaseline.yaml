narrative: |
  The sp3-v220-rebaseline enhancement re-baselined the two first-party detectors (pii_anon vanilla +
  pii_anon_swarm) against the rebuilt pii-anon-eval-data v2.2.0 substrate (66-type strict-v1). A dev-split
  measurement showed a ~0.006 F2 substrate-drift dip and a 63/66 coverage gap; a root-cause pass found the
  rebuilt corpus obfuscates several secret-like values (base64 / zero-width / OCR variants) behind their
  specific field labels, which the legacy digit-only value classes could not reach, and that the 3 new GDPR
  Article-9 special-category types were entirely uncovered.

  The delta is 12 additive, label-gated regex patterns (PL-1 Art-9 + PL-2 value-class recovery), each bound
  by the leak-direction invariant (over-mask is the safe direction; no eval-time drop) and the eval-integrity
  axiom (specific field labels / intrinsic structure only — never the universal "Record shows X" generator
  filler). It was TDD'd (RED->GREEN), verified on train-en gold (Art-9 100% recall / 0 FP), and independently
  cross-checked by a 3-frame DIVERGE/CONVERGE workflow. On the certified test split both detectors rank #1/#2
  of 13 at full 66/66 coverage. Precision stayed flat throughout, confirming no false-positive/leak-direction
  regression. The recall-floor (AX-003), the SDO gate, and the canonical-run producer are byte-identical, so
  no guarantee flips and no adversarial close was required.

  Verdict SHIP-WITH-CAVEATS. Caveats: (a) synthetic-data / home-team-tuning honesty boundary (AX-001 /
  FR-027) — the first-party detectors are tuned to this corpus's label conventions, so the 0.89-vs-0.74 gap
  over off-the-shelf detectors is not an external-validity claim; (b) two pre-existing, external-state-caused
  suite failures waived above (one user-WIP, one control-path drift tracked as task_dc3b46b5); (c) SDO
  unchanged, a fresh certified canonical run deferred as a control-path follow-up. The stage marker is carried
  UNCHANGED at 06-documentation — an enhancement does not advance the PDLC stage.
