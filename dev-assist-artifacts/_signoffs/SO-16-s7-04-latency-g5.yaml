  - "The certification-vs-performance line (deliberate): an over-budget-but-shape-valid measured latency still CERTIFIES the run (canonical_claim_run=True) and G5 then honestly FAILS at the SDO gate — exactly like G6's F2 on a certified run. An AUDIT-integrity breach (a leak / corrupt persist stamp / exfiltration) DOES refuse certification (the artifact itself is untrustworthy, like the step-3 ε bound)."
  - "RISK-6 honoured: competitor_compare.py byte-identical (7cae16c8…); competitor_tiers.py byte-identical (d9202479…). The producer writes ONLY artifacts/canonical/. Import isolation intact: latency_ceilings.py is stdlib-only and in the gate boundary scan; the gate + attacks + rating import nothing from swarm/moe/fusion/policy."

