  - "★ NO-FABRICATION is LOAD-BEARING — the breach-bury MAJOR proves a correctness rule must hold at EVERY level it applies (nested value AND whole-block). Every artifact value the G5 path reads routes through a validator (latency ms via _is_finite_number+nonneg+order; rates via _finite_unit_score; counts via _g5_genuine_count; profile via ceiling_for; system via ladder membership; persist via strict is-True; detail/sort via _safe_repr/_safe_names; the artifact ceiling tighten-only)."
  - "NFR-009 ceiling is a COMMITTED NUMERIC per-profile p50/p95/p99; the full-swarm ensemble budget 500/1000/2000 ms is real (sub-2s p99, ~6x quiet headroom + contention headroom), NOT sub-0.24ms parity, NOT vacuous. The producer measures min-of-3 per record (a single-shot wall-clock timing on a saturated host measures the scheduler, not the swarm — a 10-worker xdist host tripled the single-shot p50)."
