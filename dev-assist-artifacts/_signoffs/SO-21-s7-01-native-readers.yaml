work_stream_gate_summary:
  stories: 1
  story_gate: APPROVE   # iter-1 REQUEST_CHANGES -> iter-2 5/5 APPROVE
  adversarial_close: NOT_REQUIRED   # no competitive_supremacy.py change; readers write no control-path artifacts
  findings_remediated_in_loop:
    - "★ security-sast MAJOR-1 (iter-1): UNBOUNDED FlateDecode inflate on untrusted PDF bytes = zip-bomb memory-DoS (~1000x amplification; a ~200KB stream inflated ~200MB, peak RSS ~459MB; max_record_chars truncated only AFTER full inflate). FIX (258d3ec): chunked decompressobj loop (1 MiB steps) with the 64 MiB per-stream ceiling applied to loop chunks AND the flush tail; over-ceiling raises zlib.error into the existing corrupt-stream skip path (never partial extraction); no-progress guard terminates corrupt streams; boundary exact (== ceiling passes, +1 raises — probe-verified). Pinned by A14 [SECURITY-TEST] (bomb skipped, honest page extracted) + A16b (multi-MiB within-ceiling extracts fully)."
    - "code-quality MAJOR-2 (iter-1): new-module coverage 73%/66% below the >=90% DoD floor (real reachable stdlib paths untested). FIX: targeted tests A15 (escapes: octal/named/escaped-paren/CRLF-continuation; nested parens; '/\" show ops; orphan-string drop) + A16 (corrupt-zlib skip; drawing-only stream no-record; max_record_chars exact truncation) + A16b (truncated-escape guard; missing-endstream skip) + A17 (registry fail-closed TypeError + round-trip) + no-cover pragmas on the dep-gated OCR/DICOM execution bodies. native.py 91% / native_pdf.py 92%."
    - "code-quality MINOR (iter-1): docstrings added to all four concrete capabilities() overrides."
    - "traceability MINOR (iter-2): story §3/§12 anchor list lagged the test file — remediated at close (A14-A17 documented as gate-remediation anchors; DoD reads A1-A17)."
  findings_dispositioned:
    - "security-sast OBS x2: epic-gate pip-audit of the ocr/dicom extras (Pillow CVE-stream floor >=10 unpinned above) + the standing entry-point trust model — CARRY-FORWARD to the epic/release gate."
    - "requirements-coverage OBS x2: FR-037/NFR-022 (SHOULD, OS-matrix) deferred-with-tracking for the sprint snapshot; FR-032-native + FR-034-corpus stay OPEN MUST-board rows flagged representative-this-sprint — do NOT mark fully-verified at the release gate on S7-01 alone."
    - "axiom-compliance OBS: when real OCR/ASR backends land (Pass-2), pin AX-002 determinism-or-provenance for the inferential extraction step."
    - "traceability OBS: AX-001/002 resolve to 00-axioms/project-axioms.yaml (the established convention), not FR/NFR rows."
  gate_evidence_note: >
    The review-gate workflow's scribe wrote synthesis.md only (both iterations);
    the per-reviewer YAMLs under _reviews/story/S7-01/ were transcribed verbatim
    from the workflows' structured results (wf_44f8b3ae-51b iter-1,
    wf_2d10a313-630 iter-2), dispositions added at remediation/close.

decisions_acknowledged:
  - "★ The gate EARNED ITS KEEP at iter-1: the unbounded-inflate zip-bomb DoS was a REAL security hole in code that consumes untrusted document bytes (UC-24's whole point) — caught by the security-sast reviewer before any close. The bounded-inflate fix preserves honest-input behavior byte-identically (A4/A16b pins)."
  - "★ NFR-026 is implemented in its LOUD flavor: a reader whose backend is missing reports dependency_available=False truthfully and RAISES naming the extra — silent empty text (which would silently drop every PII span in a modality) is structurally impossible (A7/A8; the audio reader refuses by design until an ASR backend is chosen)."
  - "Capability honesty everywhere: supports_reconstruction=False on every native reader (no false FR-032 claim); audio extracts_text=False; the stdlib PDF reader's documented limits + # SWITCH-POINT(PDF-LIB) for the pypdf swap behind the same reader name."
  - "The S2-03 orchestrator-block discipline held: the reader capability surface lives in ingestion/native.py (# SWITCH-POINT(ORCH)); orchestrator.py byte-identical (0afc6deed62bbd0653ae1051b723bace)."
  - "AX-001/AX-002 upheld: handcrafted synthetic PDFs + synthetic-shaped values only; byte-driven deterministic reads (A5 5x replay); no random/uuid/time in either module."

