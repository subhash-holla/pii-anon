scope: >
  S6-01 — the query-aware masking gate (FR-023, UC-19) + a representative FR-024
  bound. When PII is processed in service of a query, the gate decides per detected
  span retain-vs-mask: it is SUBTRACTIVE-ON-MASK (DC-13) and DEFAULTS TO MASK,
  retaining a span ONLY on a positive reason-stamped relevance signal (the query
  names an alias of the entity type, or the query tokens overlap the span surface).
  The dangerous error (false-retention = leaking a query-irrelevant span) cannot
  occur by default — over-redaction is the safe error. Shipped as a STANDALONE,
  pure policy primitive (src/pii_anon/policy/query_aware.py, alongside router.py):
  the orchestrator router-pre-filter wire-in (DC-13 "intercept + mask in
  policy/router before engines/prompt assembly") is BLOCKED on the protected
  user-WIP orchestrator.py (the S2-03 block) → Pass-2; the real DATA query-aware
  scorer + learned relevance model are eval-data S5 Pass-2. A representative FR-024
  bound (over-redaction-rate + false-retention-rate vs the mask-all baseline) ships
  in-tree. FEATURE work-stream — does NOT touch competitive_supremacy.py, so NO
  adversarial SDO close required.

