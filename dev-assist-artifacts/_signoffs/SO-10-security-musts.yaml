adversarial_close:
  workflow: wqhzndsp3   # 6 read-only refuters (2/story) + integration sweep + completeness/epistemic-honesty critic
  upheld_refutations: 1
  major_caught: >
    SEC-S504-PATHTRAVERSAL (MAJOR): the S5-04 path allow-list used PurePosixPath.relative_to (purely lexical,
    never collapses '..'), so assert_path_allowed('/grant/../../../etc/passwd') with allowed_paths={'/grant'}
    RETURNED the path — defeating BOTH the runtime shim AND the load-time A6 guard (demonstrated reading an
    /etc/passwd-shaped target + a real symlink escape). All 5 iter-1 reviewers missed it; the '..' case had no test.
    THIS IS THE VALUE OF THE ADVERSARIAL CLOSE — a real sandbox-escape caught after a clean 5/5 gate.
  completeness_gaps_closed:
    - "S6-03 DoD §12 (d)/(e)/(g) lacked committed AST/nonce regression tests (true-by-construction but unpinned vs S2-05/S5-04 parity) → FIX-A committed AST sink-scan + nonce-distinctness."
    - "S6-03 scope_index + expires_at not in the AEAD AAD (raw-UPDATE mis-bucket / expired-row resurrection; NOT a confidentiality/forgery break — each surfaced only the row's own genuine plaintext) → FIX-B folded both into the AAD."
    - "S6-03 wrong-KEK list_by_scope returned [] silently while get() raised (NFR-015 consistency) → FIX-C list_by_scope fail-loud."
    - "S5-04 A2 AST guard non-vacuous but getattr/import_module-evadable + over-claimed wording → FIX-2 strengthened matcher + softened wording."
  reclose:
    workflow: wy3urfrhc   # 2 re-refuters + security-sast re-gate (both) + integration/SDO sweep
    result: "reclose_pass=true — 2/2 re-refuters all_closed (0 still-broken; the exact probes now RAISE, no over-rejection); security-sast re-review APPROVE on both iter-2 diffs (0 new MAJOR+); integration PASS."
  refuters_broken_false: >
    S2-05 forge (28+ probes: wrong-key/length-extension/canonicalization-collision/scheme-downgrade/rotation-grace — all rejected) +
    S2-05 silent-accept (50 probes: escape-hatch unreachable from production; present-broken always raises; absence→None) +
    S6-03 plaintext-recovery (raw-.db scan + cut-paste + wrong-KEK + nonce-reuse + weaponized-AAD — no break) +
    S6-03 integrity (544 byte-flips all raise; determinism + anon≠pseudo intact) — ALL confirmed broken=false.

decisions_acknowledged:
  - "S2-05: gate_v1.json is now unforgeable + fail-closed — detached HMAC-SHA256 over canonical serialization, verify-on-load (verify_on_load=True hard-wired at the production MoERouter seam), constant-time compare, key-ring rotation; absence→graceful static softmax (NFR-026), present-but-broken→raise. Optional Ed25519 behind a lazy import (gate-signing extra). Pure-stdlib default; zero new hard deps."
  - "S6-03: additive EncryptedSQLiteTokenStore(TokenStore) — AEAD (AESGCM default), per-row fresh 96-bit nonce, AAD now binds key_id|blind_index|version|scope_index|expires_at (decrypt precedes the TTL short-circuit so a tampered-then-expired row can't be masked), envelope-wrapped DEK (KEK never on disk), keyed blind-index O(1) lookup, key rotation + rewrap_all, fail-loud TokenStoreIntegrityError. The plaintext-leaking SQLiteTokenStore + providers/reidentification/key_manager + pii_anon/__init__ stay byte-identical; orchestrator unchanged (accepts any TokenStore)."
  - "S5-04: eval_framework/attacks/ seeded with the isolation substrate — safe structured spec loader (allow-list registry, scalars-only, no unsafe-deserialization), AttackSandbox capability pre-check (runner allow-listed, network=deny, path allow-list now canonicalized via realpath/normpath — closes the '..'/symlink escape), resource budget (RLIMIT_AS/CPU soft + a stdlib thread wall-clock watchdog, never a subprocess), in-process egress refusal, fail-loud SandboxViolation/SandboxBudgetExceeded. A2 AST source-hygiene guard now catches getattr/import_module/__import__ string-sink indirection. Every future real attack body (FR-011 Tier-3, FR-013 MIA) MUST run via run_attack_under_sandbox."
  - "Methodology: the per-story 5-reviewer gate is necessary but not sufficient for security MUSTs; the between-work-streams ADVERSARIAL CLOSE (live break-probes) is the catch-net — it found a MAJOR a 5/5 gate missed. Keep this close as the standing pattern for security work-streams."

findings_waived_or_deferred:
  - id: SAST-S603-OBS-created-at
    disposition: pass2-hardening
    detail: "created_at is outside the S6-03 AAD (a raw UPDATE can forge it) but it gates nothing (not key selection / TTL / bucketing) — purely an audit timestamp. Optional Pass-2 fold-into-AAD."
  - id: SAST-S603-OBS-mixed-key-partial-read
    disposition: pass2-hardening
    detail: "Post-rotation, reopening with a provider that unwraps only the newer key id silently omits older-key rows from list_by_scope (results non-empty → fail-loud guard skipped). Part of the dual-version rotation-grace model; omits rows, never reveals wrong plaintext."
  - id: SAST-S504-OBS-runtime-confinement
    disposition: pass2
    detail: "The A2 AST guard is a TEST-ONLY source-hygiene pin over the 3 repo attacks/*.py files (a runtime-assembled non-literal sink is out of scope by design); real seccomp/namespace/cgroup OS confinement + a real over-budget force-kill + thread-local egress for concurrent execution are Pass-2 (SAST-S504-OBS-1/2)."
  - id: SAST-S205-OBS-verify-on-load-escape-hatch
    disposition: pass2
    detail: "verify_on_load=False returns unverified content by design for offline tooling; provably unreachable from production (not a constructor param; the production seam hard-wires True). Consider gating behind an explicit non-production flag when real key custody lands."
  - id: TRACE-matrix-backfill (S2-05/S5-04/S6-03)
    disposition: deferred-to-sprint-gate
    detail: "traceability-matrix Story/Test columns for the 3 stories backfilled at the respective S2/S5/S6 sprint gates (matrix defers DC/Story/Test to Stages 3-5; mirrors S4-CS-01)."
  - id: real-crypto-custody (S2-05/S6-03) + real-OS-isolation (S5-04)
    disposition: pass2
    detail: "Real signing-key / KEK custody (env/secret-store/HSM/KMS) and real OS-level sandbox syscalls are Pass-2 — never agent-simulated as real. The in-tree HMAC + AEAD + in-process guards run for real against deterministic NON-PRODUCTION test keys + synthetic PII."

