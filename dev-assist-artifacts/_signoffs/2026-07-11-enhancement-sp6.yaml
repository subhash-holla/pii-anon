narrative: |
  sp6 closed the user's directive to use the external datasets plus the home benchmark to derive
  general improvements to both offerings. The evidence-first pipeline (6-dataset failure mining →
  generality bar → design → measure → mandatory close) produced the largest capability gain of the
  program: the swarm's NER channel, previously discarded by three independent mechanisms, now
  contributes on every measured corpus — with the home benchmark improving simultaneously, and the
  document-anonymization workload served by an explicit, separately-reported profile that reaches
  0.49 relaxed F2 on real court judgments (from 0.10). The 3-round adversarial close caught two
  leak-direction inversions and an inert-feature illusion that the evaluation numbers alone
  actively concealed — the program's integrity apparatus, not the leaderboard, is what made these
  changes safe to ship. Stage marker carried UNCHANGED at 06-documentation.
