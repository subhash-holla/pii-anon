  orchestrator.py WIP). S2-04 adds a DeepSeek-V3 loss-free load-balancing bias on MoERouter.route()'s
  SELECTION LOGITS ONLY: a per-expert latency penalty (biased_logit = strength − β·(cost/reference_ms))
  read from ExpertSpec.metadata["latency_cost_ms"] (optional; missing ⇒ no bias), applied before the sort
  with a total-order (logit, expert_id) tie-break gated behind sla_active. It targets the LATENCY NFRs
  (NFR-009/010) and is structurally orthogonal to the NFR-004 power signal (default_weight, which route()
  never reads — the "power-tier trap", pinned by A9). Default-off (sla_bias=None / strength=0.0) ⇒
  byte-identical static softmax (NFR-026). The bias is advisory and selection-only: it never mutates
  EnsembleFinding.confidence, never alters Shared-layer membership, and can never drop a floored span
  (AX-003 — FloorProjectingFusion/SharedLayerProjector byte-identical, the no-drop authority). The SDO
  verdict is UNCHANGED — NOT_YET, binding canonical_claim_run=False — a swarm-routing feature writes no
  benchmark artifact and flips no guarantee.

